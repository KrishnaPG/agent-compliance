# Slice h, Evals (#15). Rows follow docs/atdd/catalog.yaml. Only h1's live-run rows are non-deterministic.
slice: h
acceptance:
  - id: h1-AC1
    scenario: The ablation run covers the toy item set with and without the plugin within its budget
    covers: [1]
    given:
      - repo: {name: toy, state: base}
      - config: {state: override, key: evals.runs, value: 2}
    when:
      plugin_eval: {args: [--ablation, --runs, "2", --max-cost-usd, "5"]}
    then:
      - field: {source: eval_report, path: "arms[*].name", op: contains, value: with_plugin}
      - field: {source: eval_report, path: "arms[*].name", op: contains, value: without_plugin}
      - field: {source: eval_report, path: cost_usd, op: le, value: 5}
    traces_to: [R9, R11, G5, QBC-86]
    verification: measure
    deterministic: false
    plan_gap: "the plan names no report field names; the row uses arms[*].name and cost_usd, and the budget and run count come from policy values in the fixture"

  - id: h1-AC2
    scenario: The report gives per arm met, measurer rounds, tokens and USD with spread
    covers: [2]
    given:
      - repo: {name: toy, state: base}
    when:
      plugin_eval: {args: [--ablation, --runs, "3", --max-cost-usd, "5"]}
    then:
      - field: {source: eval_report, path: "arms[*].met", op: present}
      - field: {source: eval_report, path: "arms[*].measurer_rounds", op: present}
      - field: {source: eval_report, path: "arms[*].tokens", op: present}
      - field: {source: eval_report, path: "arms[*].usd", op: present}
      - field: {source: eval_report, path: "arms[*].spread", op: present}
    traces_to: [R11, P2, QBC-28, QBC-86]
    verification: measure
    deterministic: false
    plan_gap: "the plan names the quantities, not the field names; the row fixes them"

  - id: h1-AC3
    scenario: Measurer rounds come from the bh job records
    covers: [2]
    given:
      - repo: {name: toy, state: base}
      - recorded_model: {fixture: toy_ablation_arm}
    when:
      bh: {sub: metrics}
    then:
      - field: {source: result_json, path: "metrics[id=measurer_rounds][window=current].value", op: present}
      - field: {source: result_json, path: "metrics[id=measurer_rounds][window=current].unit", op: eq, value: "count"}
      - field: {source: result_json, path: "jobs[*].rounds", op: present}
    traces_to: [R11, G5, QBC-28]
    verification: test
    deterministic: true
    plan_gap: "the plan does not say which command reports measurer rounds; the row reads them through bh metrics"

  - id: h1-AC4
    scenario: The paid toy run is committed as evidence
    covers: [3]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      scan: {paths: ["evals/evidence/*"], kind: path}
    then:
      - paths: {paths: ["evals/evidence/toy-ablation*.json"], exist: true}
      - scan_count: {op: ge, value: 1}
    traces_to: [R9, QBC-9, QBC-86]
    verification: lint
    deterministic: true
    plan_gap: "the evidence location is not named; the row uses evals/evidence/toy-ablation*.json"

  - id: h1-AC5
    scenario: The committed evidence holds both arms with the five quantities
    covers: [3]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      validate: {instance: "evals/evidence/toy-ablation*.json", schema: evals/report.schema.json}
    then:
      - schema_valid: {valid: true}
    traces_to: [R11, QBC-28, QBC-86]
    verification: lint
    deterministic: true
    plan_gap: "no report schema is named in the plan; the row assumes evals/report.schema.json"

  - id: h1-AC6
    scenario: The plugin's own test run makes no live model call
    covers: [4]
    given:
      - repo: {name: plugin, state: candidate}
      - recorded_model: {fixture: any_job}
      - host: {condition: network_off}
    when:
      entry_point: {entry: plugin_pytest}
    then:
      - junit: {failures: 0, errors: 0}
    traces_to: [G5, QBC-86]
    verification: test
    deterministic: true

  - id: h1-AC7
    scenario: Nothing outside evals/ calls the eval runner
    covers: [4]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      scan: {paths: [harness/, bin/, hooks/, skills/, tests/], kind: text, pattern: "plugin eval"}
    then:
      - scan_count: {op: eq, value: 0}
      - paths: {paths: [evals/ablation/*], exist: true}
    traces_to: [G5, QBC-86]
    plan_gap: "the ablation suite location is not named; the row uses evals/ablation/"
    verification: lint
    deterministic: true

  - id: h2-AC1
    scenario: No wording or read-count grader directory remains
    covers: [1]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      scan: {paths: ["evals/accuracy/*/graders", "evals/*/graders"], kind: path}
    then:
      - paths: {paths: ["evals/accuracy/*/graders", "evals/*/graders"], exist: false}
    traces_to: [R9, G5, QBC-74]
    red_on_main: "paths exist false fails on main: evals/accuracy/billing-sync/graders and the other graders directories exist"
    plan_gap: "the grader locations are not listed in the plan; the row names the graders directories of the existing accuracy suites"
    verification: lint
    deterministic: true

  - id: h2-AC2
    scenario: No stale results or generator remain
    covers: [1]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      scan: {paths: ["evals/_gen", "evals/results"], kind: path}
    then:
      - paths: {paths: ["evals/_gen", "evals/results"], exist: false}
    traces_to: [R9, G5, QBC-74]
    red_on_main: "paths exist false fails on main: evals/_gen exists"
    verification: lint
    deterministic: true
    plan_gap: "stale results are not located in the plan; the row names evals/results and the evals/_gen generator directory"

  - id: h2-AC3
    scenario: No eval prompt holds an absolute path
    covers: [2]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      scan: {paths: [evals/], kind: text, pattern: "(^|[\\s\"'=:(])/(home|Users|tmp|var|root|opt)/"}
    then:
      - scan_count: {op: eq, value: 0}
    traces_to: [R9, QBC-74]
    red_on_main: "scan_count eq 0 fails on main: 11 lines under evals/ hold an absolute path"
    verification: lint
    deterministic: true

  - id: h2-AC4
    scenario: Each kept skill description has a tool_used trigger case
    covers: [3]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      scan: {paths: [evals/triggers/], kind: text, pattern: "tool_used: *Skill"}
    then:
      - scan_count: {op: ge, value: 1}
    traces_to: [R9, G5, QBC-74]
    verification: lint
    deterministic: true
    plan_gap: "the count of kept skills from a4 is not in the plan; the row cannot assert one case per skill and asserts at least one"

  - id: h2-AC5
    scenario: The trigger cases run as plugin eval cases and pass on recorded model output
    covers: [3]
    given:
      - repo: {name: plugin, state: candidate}
      - recorded_model: {fixture: trigger_cases}
    when:
      plugin_eval: {args: [evals/triggers]}
    then:
      - field: {source: eval_report, path: failures, op: eq, value: 0}
      - field: {source: eval_report, path: "cases[*].tool_used", op: present}
    traces_to: [R9, G5, QBC-74]
    verification: test
    deterministic: true
    plan_gap: "the plan names no report field names; with the stub claude on PATH the eval run makes no live call"

  - id: h3-AC1
    scenario: bh metrics computes the three metrics from git, the issue history and the job records
    spec_ref: [L2.success-of-the-whole-flow, L5.success-of-the-flow]
    covers: [0]
    given:
      - repo: {name: project, state: v2_history}
      - history: {fixture: dora_v2, period: v2}
    when:
      bh: {sub: metrics}
    then:
      - exit_code: {code: 0}
      - field: {source: result_json, path: "metrics[id=change_failure_rate][window=current].value", op: present}
      - field: {source: result_json, path: "metrics[id=lead_time_for_changes][window=current].value", op: present}
      - field: {source: result_json, path: "metrics[id=tokens_per_met_slice][window=current].value", op: present}
    traces_to: [R11, QBC-3]
    verification: test
    deterministic: true
    plan_gap: "the plan does not state the lead-time unit; the metrics[*] entries carry it in unit"

  - id: h3-AC2
    scenario: Change-failure rate counts merged slices that later got a defect sub-issue
    covers: [1]
    given:
      - repo: {name: project, state: v2_history}
      - history: {fixture: dora_four_merged_one_later_defect, period: v2}
    when:
      bh: {sub: metrics}
    then:
      - field: {source: result_json, path: "metrics[id=change_failure_rate][window=current].value", op: eq, value: 0.25}
      - field: {source: result_json, path: "metrics[id=change_failure_rate][window=current].unit", op: eq, value: "ratio"}
    traces_to: [R11, QBC-3]
    verification: test
    deterministic: true

  - id: h3-AC3
    scenario: A defect sub-issue opened before the merge does not count
    covers: [1]
    given:
      - repo: {name: project, state: v2_history}
      - history: {fixture: dora_defect_before_merge, period: v2}
    when:
      bh: {sub: metrics}
    then:
      - field: {source: result_json, path: "metrics[id=change_failure_rate][window=current].value", op: eq, value: 0}
    traces_to: [R11, QBC-3]
    verification: test
    deterministic: true
    plan_gap: "the plan says later defects count; the row reads before-merge defects as not counting"

  - id: h3-AC4
    scenario: Lead time runs from the slice sub-issue opening to its merge
    covers: [2]
    given:
      - repo: {name: project, state: v2_history}
      - history: {fixture: dora_slice_opened_to_merged_48h, period: v2}
    when:
      bh: {sub: metrics}
    then:
      - field: {source: result_json, path: "metrics[id=lead_time_for_changes][window=current].value", op: eq, value: 48}
      - field: {source: result_json, path: "metrics[id=lead_time_for_changes][window=current].unit", op: eq, value: "hours"}
    traces_to: [R11, QBC-3]
    verification: test
    deterministic: true

  - id: h3-AC5
    scenario: Tokens per met slice divides job-record tokens by the met slices
    covers: [3]
    given:
      - repo: {name: project, state: v2_history}
      - history: {fixture: dora_900k_tokens_three_met, period: v2}
    when:
      bh: {sub: metrics}
    then:
      - field: {source: result_json, path: "metrics[id=tokens_per_met_slice][window=current].value", op: eq, value: 300000}
      - field: {source: result_json, path: "metrics[id=tokens_per_met_slice][window=current].unit", op: eq, value: "tokens"}
    traces_to: [R11, G5, QBC-28]
    verification: test
    deterministic: true
    plan_gap: "the plan does not say whether tokens of unmet slices count; the row counts all job-record tokens"

  - id: h3-AC6
    scenario: The pre-v2 baseline file is written from the pre-v2 history
    covers: [4]
    given:
      - repo: {name: project, state: pre_v2_history}
      - history: {fixture: dora_pre_v2, period: pre_v2}
    when:
      bh: {sub: metrics, args: [--baseline]}
    then:
      - field: {source: baseline_file, path: change_failure_rate, op: present}
      - field: {source: baseline_file, path: lead_time_hours, op: present}
      - field: {source: baseline_file, path: tokens_per_met_slice, op: present}
    traces_to: [R11, QBC-3, QBC-28]
    verification: test
    deterministic: true
    plan_gap: "the plan names no argument for writing the baseline; the row uses --baseline"

  - id: h3-AC7
    scenario: A second run leaves the baseline file byte-identical
    covers: [4]
    given:
      - repo: {name: project, state: pre_v2_history}
      - history: {fixture: dora_pre_v2, period: pre_v2}
    when:
      bh: {sub: metrics, args: [--baseline], rerun: true}
    then:
      - field: {source: baseline_file, path: change_failure_rate, op: present}
      - file_unchanged: {target: baseline_file}
    traces_to: [R11, QBC-3]
    verification: test
    deterministic: true

  - id: h3-AC8
    scenario: Both periods are shown side by side
    spec_ref: [L2.success-of-the-whole-flow]
    covers: [5]
    given:
      - repo: {name: project, state: v2_history}
      - history: {fixture: dora_both, period: both}
    when:
      bh: {sub: metrics}
    then:
      - field: {source: result_json, path: "metrics[id=change_failure_rate][window=baseline].value", op: present}
      - field: {source: result_json, path: "metrics[id=change_failure_rate][window=current].value", op: present}
      - snapshot: {name: metrics_side_by_side}
    traces_to: [R11, QBC-28]
    verification: test
    deterministic: true

  - id: h3-AC9
    scenario: The metric tests run on a recorded history fixture with no network
    covers: [6]
    given:
      - repo: {name: project, state: v2_history}
      - history: {fixture: dora_both, period: both}
      - host: {condition: network_off}
    when:
      bh: {sub: metrics}
    then:
      - exit_code: {code: 0}
    traces_to: [R11, G5, QBC-3]
    verification: test
    deterministic: true
