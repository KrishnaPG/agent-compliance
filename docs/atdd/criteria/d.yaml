# Slice d, Flow (#11). Rows follow docs/atdd/catalog.yaml; leaf numbers come from `build.py --bullets`.
slice: d
acceptance:
  # ---------------------------------------------------------------- d0
  - id: d0-AC1
    scenario: A valid packet fixture validates against the one packet schema
    covers: [1]
    spec_ref: [L2.schema-and-validation, common.any-json-output]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      validate: {instance: toy_item_packet, schema: harness/schema/packet.schema.json}
    then:
      - schema_valid: {valid: true}
    traces_to: [R5, R3, QBC-24, QBC-31]
    verification: test
    deterministic: true
    plan_gap: "the bullet prescribes one contract read by three roles; the row asserts the observable half (the instance validates against the one schema); the enforce rows prove the shared reading"

  - id: d0-AC2
    scenario: The assembled packet carries id and parent_issue
    covers: [2, 3]
    spec_ref: [common.reference-to-the-contract]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - field: {source: packet, path: id, op: present}
      - field: {source: packet, path: parent_issue, op: present}
    traces_to: [R5, QBC-24]
    verification: test
    deterministic: true

  - id: d0-AC3
    scenario: The packet's tier is mechanical or design-affecting, and the goal states intent and why
    covers: [4, 5]
    spec_ref: [L2.goal-without-method]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: mechanical}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - field: {source: packet, path: tier, op: eq, value: mechanical}
      - field: {source: packet, path: goal, op: present}
      - schema_valid: {valid: true, instance: packet, schema: harness/schema/packet.schema.json}
    traces_to: [R5, P6, QBC-24, QBC-42]
    verification: test
    deterministic: true
    plan_gap: "\"the intent and why, with no design\" is checked only through the design-field rejection in d0-AC11"

  - id: d0-AC4
    scenario: applies holds all principles and the QBC ids
    covers: [6]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - field: {source: packet, path: "applies[*].id", op: contains, value: P1}
      - field: {source: packet, path: "applies[*].id", op: contains, value: P12}
      - field: {source: packet, path: "applies[*].id", op: contains, value: QBC-24}
      - field: {source: packet, path: "applies[*].text", op: in_file, value: docs/spec/quality-by-construction.md}
    traces_to: [R5, P1, QBC-38]
    verification: test
    deterministic: true

  - id: d0-AC5
    scenario: "constraints and the rest of the field list are present"
    covers: [7, 9, 10, 11]
    spec_ref: ["L2.definition-of-done"]
    given:
      - repo: {name: "toy", state: "base"}
      - packet: {fixture: "toy_item", variant: "valid"}
    when:
      program_step: {step: "assemble_packet", item: "toy_item"}
    then:
      - field: {source: "packet", path: "constraints.decisions[*].id", op: "present"}
      - field: {source: "packet", path: "constraints.decisions[*].text", op: "present"}
      - field: {source: "packet", path: "constraints.owners[*]", op: "present"}
      - field: {source: "packet", path: "constraints.interfaces[*]", op: "present"}
      - field: {source: "packet", path: "constraints.declared_paths[*]", op: "present"}
      - field: {source: "packet", path: "constraints.limits", op: "present"}
      - field: {source: "packet", path: "verifier.checks[*]", op: "present"}
      - field: {source: "packet", path: "paved_road.check_command", op: "present"}
      - field: {source: "packet", path: "definition_of_done", op: "present"}
    traces_to: ["R5", "G3", "QBC-33", "QBC-37", "QBC-38"]
    verification: test
    deterministic: true
  - id: d0-AC6
    scenario: Every acceptance scenario carries an id, traces_to and a verification from the closed four
    covers: [8]
    spec_ref: [L2.ids-traceability-verification-method-per-acceptance-item, L2.acceptance-criteria]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - field: {source: packet, path: "acceptance[*].id", op: present}
      - field: {source: packet, path: "acceptance[*].traces_to", op: present}
      - field: {source: packet, path: "acceptance[*].verification", op: matches, value: "^(test|lint|fitness|measure)$"}
    traces_to: [R5, QBC-39]
    verification: test
    deterministic: true

  - id: d0-AC7
    scenario: Content over the size cap is referenced by path and the packet still validates
    covers: [12]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: over_cap}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - fact: {kind: over_cap}
      - field: {source: packet, path: "overflow[*].path", op: exists}
      - schema_valid: {valid: true, instance: packet, schema: harness/schema/packet.schema.json}
    traces_to: [R5, QBC-33]
    verification: test
    plan_gap: "overflow[*].path awaits the owner's decision (docs/atdd/fields.yaml); the plan names no field for the moved text"
    deterministic: true

  - id: d0-AC8
    scenario: A packet with a design field fails validation and teaches
    covers: [13]
    spec_ref: [L2.goal-without-method]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: design_field}
    when:
      program_step: {step: validate_packet, item: toy_item}
    then:
      - schema_valid: {valid: false, instance: "packet", schema: "harness/schema/packet.schema.json"}
      - teaching: {channel: stderr, wrong: "packet has a design field", right: "the goal states the intent and why, with no design", prevent: "put the design in the declared contract, schema or role delta file, not in the packet"}
    traces_to: [R5, P1, QBC-42, QBC-37]
    verification: test
    deterministic: true
    plan_gap: "the plan states no teaching text for a failed packet; the wording names the field and the rule from the d0 bullets"

  - id: d0-AC9
    scenario: A scenario without traces_to fails validation and teaches
    covers: [13]
    spec_ref: [L2.ids-traceability-verification-method-per-acceptance-item]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: scenario_without_traces_to}
    when:
      program_step: {step: validate_packet, item: toy_item}
    then:
      - schema_valid: {valid: false, instance: "packet", schema: "harness/schema/packet.schema.json"}
      - teaching: {channel: stderr, wrong: "scenario without traces_to", right: "traces_to lists a G, P, R or QBC id", prevent: "give every acceptance scenario traces_to before the packet is accepted"}
    traces_to: [R5, QBC-39]
    verification: test
    deterministic: true
    plan_gap: "the plan states no teaching text for a failed packet; the wording names the field and the rule from the d0 bullets"

  - id: d0-AC10
    scenario: A scenario without verification fails validation and teaches
    covers: [13]
    spec_ref: [L2.ids-traceability-verification-method-per-acceptance-item]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: scenario_without_verification}
    when:
      program_step: {step: validate_packet, item: toy_item}
    then:
      - schema_valid: {valid: false, instance: "packet", schema: "harness/schema/packet.schema.json"}
      - teaching: {channel: stderr, wrong: "scenario without verification", right: "verification is one of test, lint, fitness, measure", prevent: "give every acceptance scenario a verification (ISO/IEC/IEEE 29148) before the packet is accepted"}
    traces_to: [R5, QBC-39]
    verification: test
    deterministic: true
    plan_gap: "the plan states no teaching text for a failed packet; the wording names the field and the rule from the d0 bullets"

  - id: d0-AC11
    scenario: The measurer and bh check run exactly the packet's verifier list
    covers: [14]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - host: {condition: builder_sandbox}
    when:
      bh: {sub: check}
    then:
      - same_result: {a: check_run_checks, b: measure_run_checks, compare: equal}
      - same_result: {a: check_run_checks, b: packet_verifier_list, compare: equal}
    traces_to: [R5, G3, QBC-24, QBC-37]
    verification: test
    deterministic: true

  - id: d0-AC12
    scenario: Rendering the fixture packet gives the golden Markdown
    covers: [15]
    spec_ref: [L3.messages-and-renderings]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: render_packet, item: toy_item}
    then:
      - snapshot: {name: toy_item_packet_markdown}
    traces_to: [R5, QBC-24, QBC-38]
    verification: test
    deterministic: true

  # ---------------------------------------------------------------- d1
  - id: d1-AC1
    scenario: Every assembled packet validates against d0
    covers: [1]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      validate: {instance: assembled_toy_item_packet, schema: harness/schema/packet.schema.json}
    then:
      - schema_valid: {valid: true}
      - field: {source: packet, path: constraints, op: present}
    traces_to: [R5, QBC-24, QBC-37, QBC-38]
    verification: test
    deterministic: true
    plan_gap: "\"cited by id\" names no id format, so only the presence of constraints is asserted"

  - id: d1-AC2
    scenario: A mechanical packet may name the exact edit in its goal
    covers: [2]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: mechanical}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - field: {source: packet, path: goal, op: present}
      - no_fact: {kind: launch_refused}
      - schema_valid: {valid: true, instance: packet, schema: harness/schema/packet.schema.json}
    traces_to: [R5, P4, QBC-42]
    verification: test
    deterministic: true

  - id: d1-AC3
    scenario: Program-written fields do not count toward the packet token limit
    covers: [3]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - threshold: {metric: planner_fields_tokens, op: le, bound: sizing.packet_tokens, default: 1600}
      - no_fact: {kind: over_cap}
    traces_to: [P8, QBC-33]
    verification: measure
    deterministic: true
    plan_gap: "the fixture must hold large program-written fields and small planner-written fields; the plan names no fixture"

  - id: d1-AC4
    scenario: A lowered token limit makes the same packet over the cap, and over the cap is a fact
    covers: [3, 4]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: over_cap}
      - config: {state: override, key: sizing.packet_tokens, value: 400}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - fact: {kind: over_cap}
      - field: {source: packet, path: "overflow[*].path", op: exists}
      - schema_valid: {valid: true, instance: packet, schema: harness/schema/packet.schema.json}
    traces_to: [P8, QBC-33, QBC-40]
    verification: test
    plan_gap: "overflow[*].path awaits the owner's decision (docs/atdd/fields.yaml); the plan names no field for the moved text"
    deterministic: true

  - id: d1-AC5
    scenario: A launch is never refused for size
    covers: [5]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: over_cap}
    when:
      program_step: {step: launch_builder, item: toy_item}
    then:
      - no_fact: {kind: launch_refused}
      - fact: {kind: over_cap}
    traces_to: [P4, QBC-33, QBC-40]
    verification: test
    deterministic: true

  # ---------------------------------------------------------------- d2
  - id: d2-AC3
    scenario: "The packet shows the acceptance test paths and the targets with numbers"
    covers: [1]
    given:
      - repo: {name: "toy", state: "base"}
      - packet: {fixture: "toy_item", variant: "valid"}
    when:
      program_step: {step: "assemble_packet", item: "toy_item"}
    then:
      - field: {source: "packet", path: "verifier.acceptance_paths[*]", op: "present"}
      - field: {source: "packet", path: "verifier.targets[*].item", op: "present"}
      - field: {source: "packet", path: "verifier.targets[*].metric", op: "present"}
      - field: {source: "packet", path: "verifier.targets[*].op", op: "present"}
      - field: {source: "packet", path: "verifier.targets[*].value", op: "present"}
      - field: {source: "packet", path: "verifier.targets[*].unit", op: "present"}
      - field: {source: "packet", path: "acceptance[*].id", op: "present"}
    traces_to: ["G3", "R5", "QBC-24", "QBC-38"]
    verification: test
    deterministic: true
  - id: d2-AC6
    scenario: "The paved road names bh check"
    covers: [4]
    given:
      - repo: {name: "toy", state: "base"}
      - packet: {fixture: "toy_item", variant: "valid"}
    when:
      program_step: {step: "assemble_packet", item: "toy_item"}
    then:
      - field: {source: "packet", path: "paved_road.check_command", op: "eq", value: "bh check"}
    traces_to: ["G1", "G3", "QBC-24", "QBC-49"]
    verification: test
    deterministic: true
  - id: d2-AC7
    scenario: "The paved road says where the builder's tests go and the dependency command"
    covers: [5]
    given:
      - repo: {name: "toy", state: "base"}
      - packet: {fixture: "toy_item", variant: "valid"}
    when:
      program_step: {step: "assemble_packet", item: "toy_item"}
    then:
      - field: {source: "packet", path: "paved_road.test_paths[*]", op: "present"}
      - field: {source: "packet", path: "paved_road.dependency_command", op: "present"}
    traces_to: ["G3", "P7", "QBC-24", "QBC-38"]
    verification: test
    deterministic: true
  # ---------------------------------------------------------------- d3
  - id: d3-AC1
    scenario: bh check reports a planted violation in the clone working tree through the same checks as the measurer
    covers: [1]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - planted: {plant: naive_datetime, class: violation, where: working_tree}
      - host: {condition: builder_sandbox}
    when:
      bh: {sub: check}
    then:
      - teaching: {channel: stdout, wrong: "naive datetime without a timezone", right: "use a timezone-aware datetime", prevent: "run bh check before finishing so the lint rule reports it"}
      - file_unchanged: {target: outside_checkout}
    traces_to: [G1, R5, QBC-16]
    verification: test
    deterministic: true
    plan_gap: "the plan prescribes how the check runs (temp dir, shared code); the observable consequence is the teaching output and the equality in d3-AC5"

  - id: d3-AC2
    scenario: Two bh check runs at the same moment both complete, with no lock
    covers: [2]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - host: {condition: run_in_progress}
      - host: {condition: builder_sandbox}
    when:
      bh: {sub: check, parallel: 2}
    then:
      - exit_code: {code: 0}
      - no_fact: {kind: launch_refused}
    traces_to: [G1, QBC-55]
    verification: test
    deterministic: true

  - id: d3-AC3
    scenario: bh check completes with the network off and prewarmed caches
    covers: [3]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - host: {condition: network_off}
      - host: {condition: caches_prewarmed}
      - host: {condition: builder_sandbox}
    when:
      bh: {sub: check}
    then:
      - exit_code: {code: 0}
    traces_to: [G3, QBC-51, QBC-55]
    verification: test
    deterministic: true
    plan_gap: "\"tools pinned and installed at setup\" prescribes setup; the row asserts the observable result (a full offline run)"

  - id: d3-AC4
    scenario: bh check prints the missed checks' teaching messages and states what it skips
    covers: [4]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - planted: {plant: naive_datetime, class: violation, where: working_tree}
      - host: {condition: builder_sandbox}
    when:
      bh: {sub: check}
    then:
      - teaching: {channel: stdout, wrong: "naive datetime without a timezone", right: "use a timezone-aware datetime", prevent: "run bh check before finishing so the lint rule reports it"}
      - output_contains: {channel: stdout, text: fresh-stack}
      - lines: {channel: stdout, pattern: "@teaching_shape|fresh-stack", every: true}
    traces_to: [G3, R5, QBC-16, QBC-55]
    verification: test
    deterministic: true

  - id: d3-AC5
    scenario: On planted trees inside the sandbox, the missed checks equal the measurer's
    covers: [5]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - planted: {plant: gutted_test, class: gaming, where: working_tree}
      - host: {condition: builder_sandbox}
    when:
      bh: {sub: check}
    then:
      - same_result: {a: check_missed_checks, b: measure_missed_checks, compare: equal}
    traces_to: [G1, G3, R5, QBC-16]
    verification: test
    deterministic: true

  # ---------------------------------------------------------------- d4
  - id: d4-AC1
    scenario: The authoritative packet is kept by digest in the orchestrator's directory and a launch leaves it unchanged
    covers: [1]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: launch_builder, item: toy_item}
    then:
      - file_unchanged: {target: orchestrator_packet}
      - field: {source: result_json, path: "jobs[*].packet_sha256", op: eq, value: $packet_sha256}
    traces_to: [R5, QBC-24, QBC-48]
    verification: test
    deterministic: true
    plan_gap: "the bullet prescribes the storage mechanism; the row asserts the digest of the orchestrator copy is stable across a launch"

  - id: d4-AC2
    scenario: The packet arrives once at SessionStart as additionalContext
    covers: [2]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - hook_input: {event: SessionStart, tool: none, agent_type: builder, packet: registered, target: none, touch: first}
    when:
      hook: {hook: H1}
    then:
      - field: {source: hook_output, path: additionalContext, op: present}
      - output_contains: {channel: additional_context, text: $packet.goal}
    traces_to: [R5, QBC-46, QBC-49]
    verification: test
    deterministic: true

  - id: d4-AC3
    scenario: A second SessionStart for the same packet adds nothing
    covers: [2]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - hook_input: {event: SessionStart, tool: none, agent_type: builder, packet: registered, target: none, touch: repeat}
    when:
      hook: {hook: H1}
    then:
      - field: {source: hook_output, path: additionalContext, op: absent}
      - exit_code: {code: 0}
    traces_to: [R5, QBC-49]
    verification: test
    deterministic: true
    plan_gap: "\"arrives once\" does not say what a repeat looks like; the row treats a repeat touch as absent context"

  - id: d4-AC4
    scenario: The launch prompt is a fixed line that names no goal
    covers: [2]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: launch_builder, item: toy_item}
    then:
      - field: {source: launch_args, path: prompt, op: present}
      - field: {source: launch_args, path: prompt, op: not_contains, value: goal}
    traces_to: [R5, QBC-46, QBC-49]
    verification: test
    deterministic: true
    plan_gap: "the fixed line's text is not given; the row asserts it is present and that it holds no goal text"

  - id: d4-AC5
    scenario: A packet edited inside the clone changes nothing the program reads
    covers: [3]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      builder_action: {tool: Edit, action: edit, target: clone_packet}
    then:
      - file_unchanged: {target: orchestrator_packet}
      - field: {source: result_json, path: "jobs[*].packet_sha256", op: eq, value: $packet_sha256}
    traces_to: [R5, P6, QBC-24, QBC-48]
    verification: test
    deterministic: true

  - id: d4-AC6
    scenario: SubagentStart is not used for program launches
    covers: [4]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      scan: {paths: [hooks/hooks.json, harness/lib/], kind: text, pattern: SubagentStart}
    then:
      - scan_count: {op: eq, value: 0}
      - field: {source: hooks_json, path: hooks.SessionStart, op: present}
    traces_to: [R5, QBC-49]
    verification: lint
    deterministic: true

  # ---------------------------------------------------------------- d6
  - id: d6-AC1
    scenario: The test author runs before the builder as a separate job and writes the acceptance criteria into the packet
    covers: [1]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - recorded_model: {fixture: test_author_rows}
    when:
      bh: {sub: run}
    then:
      - jobs: {assert: order, values: [test_author, builder]}
      - jobs: {assert: distinct, values: [test_author, builder]}
      - field: {source: packet, path: "acceptance[*].verification", op: present}
    traces_to: [R3, P6, QBC-31, QBC-34]
    verification: test
    deterministic: true

  - id: d6-AC2
    scenario: The acceptance criteria the test author wrote are valid against the packet schema
    covers: [1]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - recorded_model: {fixture: test_author_rows}
    when:
      bh: {sub: run}
    then:
      - schema_valid: {valid: true, instance: packet, schema: harness/schema/packet.schema.json}
    traces_to: [R3, P3, QBC-31]
    verification: test
    deterministic: true

  - id: d6-AC5
    scenario: The test author's acceptance tests are committed with the packet in protected paths in the plan commit
    covers: [2]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - recorded_model: {fixture: test_author_rows}
    when:
      bh: {sub: run}
    then:
      - git: {assert: path_in_plan_commit, path: $packet.verifier.acceptance_paths}
    traces_to: [R3, QBC-31, QBC-41]
    verification: test
    deterministic: true

  - id: d6-AC8
