# Slice d, Flow (#11). Rows follow docs/atdd/catalog.yaml; leaf numbers come from `build.py --bullets`.
slice: d
criteria:
  # ---------------------------------------------------------------- d0
  - id: d0-AC1
    scenario: A valid packet fixture validates against the one packet schema
    covers: [1]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      validate: {instance: toy_item_packet, schema: harness/schema/packet.schema.json}
    then:
      - schema_valid: {valid: true}
      - needs_keyword: {reason: "that the test author, builder and measurer all read this one schema is a statement about shared reading, not an observable output"}
    traces_to: [R5, R3, QBC-24, QBC-31]
    method: test
    deterministic: true
    plan_gap: "the bullet prescribes one contract read by three roles; the row asserts the observable half (the instance validates against the one schema)"

  - id: d0-AC2
    scenario: The assembled packet carries id and parent_issue
    covers: [2, 3]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - field: {source: packet, path: id, op: present}
      - field: {source: packet, path: parent_issue, op: present}
    traces_to: [R5, QBC-24]
    method: test
    deterministic: true

  - id: d0-AC3
    scenario: The tier of a mechanical item is derived by the program, and the goal states intent and why
    covers: [4, 5]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: mechanical}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - field: {source: packet, path: tier, op: eq, value: mechanical}
      - field: {source: packet, path: goal, op: present}
      - schema_valid: {valid: true}
    traces_to: [R5, P6, QBC-24, QBC-42]
    method: test
    deterministic: true
    plan_gap: "\"the intent and why, with no design\" is checked only through the design-field rejection in d0-AC11"

  - id: d0-AC4
    scenario: applies holds all principles and the QBC ids
    covers: [6]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - field: {source: packet, path: applies, op: contains, value: P1}
      - field: {source: packet, path: applies, op: contains, value: P12}
      - field: {source: packet, path: applies, op: contains, value: QBC-24}
      - needs_keyword: {reason: "that each applies item is copied verbatim from spec section 0 needs a comparison of packet text with a spec source"}
    traces_to: [R5, P1, QBC-38]
    method: test
    deterministic: true

  - id: d0-AC5
    scenario: constraints and the rest of the field list are present
    covers: [7, 9, 10, 11]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - field: {source: packet, path: constraints, op: present}
      - field: {source: packet, path: verifier, op: present}
      - field: {source: packet, path: paved_road, op: present}
      - field: {source: packet, path: definition_of_done, op: present}
    traces_to: [R5, G3, QBC-33, QBC-37, QBC-38]
    method: test
    deterministic: true
    plan_gap: "the parts inside constraints (decision lines, owners, interfaces, paths, limits) have no named sub-fields, so only the field's presence is asserted"

  - id: d0-AC6
    scenario: Every acceptance scenario carries an id, traces_to and a verification from the closed four
    covers: [8]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - field: {source: packet, path: "acceptance[*].id", op: present}
      - field: {source: packet, path: "acceptance[*].traces_to", op: present}
      - field: {source: packet, path: "acceptance[*].verification", op: matches, value: "^(test|lint|fitness|measure)$"}
    traces_to: [R5, QBC-39]
    method: test
    deterministic: true

  - id: d0-AC7
    scenario: Content over the size cap is referenced by path and the packet still validates
    covers: [12]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: over_cap}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - schema_valid: {valid: true}
      - fact: {kind: over_cap}
      - needs_keyword: {reason: "the file name that carries the moved text is not named by the plan, so the path reference cannot be matched"}
    traces_to: [R5, QBC-33]
    method: test
    deterministic: true

  - id: d0-AC8
    scenario: A packet with a design field fails validation and teaches
    covers: [13]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: design_field}
    when:
      validate: {instance: toy_item_packet, schema: harness/schema/packet.schema.json}
    then:
      - schema_valid: {valid: false}
      - teaching: {channel: stderr, wrong: design, right: intent and why}
    traces_to: [R5, P1, QBC-42, QBC-37]
    method: test
    deterministic: true
    plan_gap: "the plan states no teaching text for a failed packet; wording is taken from the goal field's definition and the prevent part is not stated"

  - id: d0-AC9
    scenario: A scenario without traces_to fails validation and teaches
    covers: [13]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: scenario_without_traces_to}
    when:
      validate: {instance: toy_item_packet, schema: harness/schema/packet.schema.json}
    then:
      - schema_valid: {valid: false, error_path: "acceptance"}
      - teaching: {channel: stderr, wrong: traces_to, right: "G, P, R or QBC"}
    traces_to: [R5, QBC-39]
    method: test
    deterministic: true
    plan_gap: "the plan states no teaching text for a failed packet; the prevent part is not stated"

  - id: d0-AC10
    scenario: A scenario without verification fails validation and teaches
    covers: [13]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: scenario_without_verification}
    when:
      validate: {instance: toy_item_packet, schema: harness/schema/packet.schema.json}
    then:
      - schema_valid: {valid: false, error_path: "acceptance"}
      - teaching: {channel: stderr, wrong: verification, right: "test, lint, fitness, measure"}
    traces_to: [R5, QBC-39]
    method: test
    deterministic: true
    plan_gap: "the plan states no teaching text for a failed packet; the prevent part is not stated"

  - id: d0-AC11
    scenario: The measurer and bh check run exactly the packet's verifier list
    covers: [14]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - host: {condition: builder_sandbox}
    when:
      bh: {sub: check}
    then:
      - same_result: {a: check_run_checks, b: measure_run_checks, compare: equal}
      - same_result: {a: check_run_checks, b: packet_verifier_list, compare: equal}
    traces_to: [R5, G3, QBC-24, QBC-37]
    method: test
    deterministic: true

  - id: d0-AC12
    scenario: Rendering the fixture packet gives the golden Markdown
    covers: [15]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: render_packet, item: toy_item}
    then:
      - snapshot: {name: toy_item_packet_markdown}
    traces_to: [R5, QBC-24, QBC-38]
    method: test
    deterministic: true

  # ---------------------------------------------------------------- d1
  - id: d1-AC1
    scenario: Every assembled packet validates against d0
    covers: [1]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - schema_valid: {valid: true}
      - field: {source: packet, path: constraints, op: present}
    traces_to: [R5, QBC-24, QBC-37, QBC-38]
    method: test
    deterministic: true
    plan_gap: "\"cited by id\" names no id format, so only the presence of constraints is asserted"

  - id: d1-AC2
    scenario: A mechanical packet may name the exact edit in its goal
    covers: [2]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: mechanical}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - schema_valid: {valid: true}
      - field: {source: packet, path: goal, op: present}
      - no_fact: {kind: launch_refused}
    traces_to: [R5, P4, QBC-42]
    method: test
    deterministic: true

  - id: d1-AC3
    scenario: Program-written fields do not count toward the packet token limit
    covers: [3]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - threshold: {metric: planner_fields_tokens, op: le, bound: sizing.packet_tokens, default: 1600}
      - no_fact: {kind: over_cap}
    traces_to: [P8, QBC-33]
    method: measure
    deterministic: true
    plan_gap: "the fixture must hold large program-written fields and small planner-written fields; the plan names no fixture"

  - id: d1-AC4
    scenario: A lowered token limit makes the same packet over the cap, and over the cap is a fact
    covers: [3, 4]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: over_cap}
      - config: {state: override, key: sizing.packet_tokens, value: 400}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - fact: {kind: over_cap}
      - schema_valid: {valid: true}
      - needs_keyword: {reason: "the moved text's file and the reference to it in the packet are not named by the plan"}
    traces_to: [P8, QBC-33, QBC-40]
    method: test
    deterministic: true

  - id: d1-AC5
    scenario: A launch is never refused for size
    covers: [5]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: over_cap}
    when:
      program_step: {step: launch_builder, item: toy_item}
    then:
      - no_fact: {kind: launch_refused}
      - fact: {kind: over_cap}
    traces_to: [P4, QBC-33, QBC-40]
    method: test
    deterministic: true

  # ---------------------------------------------------------------- d2
  - id: d2-AC1
    scenario: With no agent job, the program fills acceptance, verifier and paved_road and the packet validates
    covers: [0]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - jobs: {assert: none_of_kind, values: [planner, judge, test_author, builder, reviewer]}
      - schema_valid: {valid: true}
      - field: {source: packet, path: acceptance, op: present}
      - field: {source: packet, path: verifier, op: present}
      - field: {source: packet, path: paved_road, op: present}
    traces_to: [G3, R5, QBC-24, QBC-38]
    method: test
    deterministic: true

  - id: d2-AC2
    scenario: The rendered packet sits in the clone's packet directory, which the builder cannot write
    covers: [0]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - host: {condition: builder_sandbox}
    when:
      builder_action: {tool: Write, action: write, target: clone_packet}
    then:
      - file_unchanged: {target: orchestrator_packet}
      - refused: {by: sandbox, wrong: packet, right: orchestrator, prevent: read-only}
    traces_to: [R5, QBC-24, QBC-49]
    method: test
    deterministic: true
    plan_gap: "the plan gives no refusal text for a write into the packet directory; substrings are best guesses from the packet's read-only role"

  - id: d2-AC3
    scenario: The packet shows the acceptance test paths and the targets with numbers
    covers: [1]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - field: {source: packet, path: verifier, op: matches, value: "[0-9]"}
      - field: {source: packet, path: "acceptance[*].id", op: present}
    traces_to: [G3, R5, QBC-24, QBC-38]
    method: test
    deterministic: true
    plan_gap: "the field holding the test paths is not named, so only acceptance ids and a number in the verifier list are asserted"

  - id: d2-AC4
    scenario: The packet carries the lint and fitness rules with teaching messages and the ratchet baselines
    covers: [2]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: render_packet, item: toy_item}
    then:
      - field: {source: packet, path: verifier, op: present}
      - output_contains: {channel: packet_markdown, text: baseline}
    traces_to: [G3, R5, QBC-38, QBC-54]
    method: test
    deterministic: true
    plan_gap: "\"as they land\" ties the content to c3, c6, c8 and c4 being finished; the row checks the packet carries whatever rules and baselines exist at the fixture state"

  - id: d2-AC5
    scenario: The packet holds the text of every cited rule and decision line
    covers: [3]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - field: {source: packet, path: applies, op: present}
      - needs_keyword: {reason: "that every cited id has its source text in the packet needs a per-id comparison with the cited document"}
    traces_to: [R5, QBC-24, QBC-38]
    method: test
    deterministic: true

  - id: d2-AC6
    scenario: The paved road names bh check
    covers: [4]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - field: {source: packet, path: paved_road, op: contains, value: bh check}
    traces_to: [G1, G3, QBC-24, QBC-49]
    method: test
    deterministic: true

  - id: d2-AC7
    scenario: The paved road says where the builder's tests go and the dependency command
    covers: [5]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: assemble_packet, item: toy_item}
    then:
      - field: {source: packet, path: paved_road, op: present}
      - field: {source: packet, path: paved_road, op: matches, value: "(?i)test"}
    traces_to: [G3, P7, QBC-24, QBC-38]
    method: test
    deterministic: true
    plan_gap: "the dependency command comes from c1 and is not named here; the row asserts only that the road mentions where tests go"

  - id: d2-AC8
    scenario: The packet names the tier-trigger paths
    covers: [6]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: render_packet, item: toy_item}
    then:
      - output_contains: {channel: packet_markdown, text: tiers.triggers}
    traces_to: [R5, QBC-24, QBC-38]
    method: test
    deterministic: true
    plan_gap: "the plan does not say how the trigger paths are shown; the limits key tiers.triggers from d9 is used as the marker"

  - id: d2-AC9
    scenario: The packet says that the program commits
    covers: [7]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: render_packet, item: toy_item}
    then:
      - output_contains: {channel: packet_markdown, text: program commits}
    traces_to: [R5, QBC-24, QBC-57]
    method: test
    deterministic: true
    plan_gap: "wording of the statement is not given; the row uses the plan's own phrase"

  - id: d2-AC10
    scenario: The packet says how to ask for a config change
    covers: [8]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: config_change}
    when:
      program_step: {step: render_packet, item: toy_item}
    then:
      - output_contains: {channel: packet_markdown, text: final report}
    traces_to: [G3, R5, QBC-24, QBC-54]
    method: test
    deterministic: true

  # ---------------------------------------------------------------- d3
  - id: d3-AC1
    scenario: bh check reports a planted violation in the clone working tree through the same checks as the measurer
    covers: [1]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - planted: {plant: naive_datetime, class: violation, where: working_tree}
      - host: {condition: builder_sandbox}
    when:
      bh: {sub: check}
    then:
      - teaching: {channel: stdout, wrong: datetime, right: timezone, prevent: lint}
      - needs_keyword: {reason: "that the check runs in a temp dir under the clone and reuses the measurer's code rather than a copy is internal; only the equal result of d3-AC5 is observable"}
    traces_to: [G1, R5, QBC-16]
    method: test
    deterministic: true
    plan_gap: "the plan prescribes how the check runs (temp dir, shared code); the observable consequence is the teaching output and the equality in d3-AC5"

  - id: d3-AC2
    scenario: Two bh check runs at the same moment both complete, with no lock
    covers: [2]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - host: {condition: run_in_progress}
      - host: {condition: builder_sandbox}
    when:
      bh: {sub: check, parallel: 2}
    then:
      - exit_code: {code: 0}
      - no_fact: {kind: launch_refused}
    traces_to: [G1, QBC-55]
    method: test
    deterministic: true

  - id: d3-AC3
    scenario: bh check completes with the network off and prewarmed caches
    covers: [3]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - host: {condition: network_off}
      - host: {condition: caches_prewarmed}
      - host: {condition: builder_sandbox}
    when:
      bh: {sub: check}
    then:
      - exit_code: {code: 0}
    traces_to: [G3, QBC-51, QBC-55]
    method: test
    deterministic: true
    plan_gap: "\"tools pinned and installed at setup\" prescribes setup; the row asserts the observable result (a full offline run)"

  - id: d3-AC4
    scenario: bh check prints the missed checks' teaching messages and states what it skips
    covers: [4]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - planted: {plant: naive_datetime, class: violation, where: working_tree}
      - host: {condition: builder_sandbox}
    when:
      bh: {sub: check}
    then:
      - teaching: {channel: stdout, wrong: datetime, right: timezone, prevent: lint}
      - output_contains: {channel: stdout, text: fresh-stack}
      - needs_keyword: {reason: "that stdout holds nothing besides the missed checks' messages and the skip statement"}
    traces_to: [G3, R5, QBC-16, QBC-55]
    method: test
    deterministic: true

  - id: d3-AC5
    scenario: On planted trees inside the sandbox, the missed checks equal the measurer's
    covers: [5]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - planted: {plant: gutted_test, class: gaming, where: working_tree}
      - host: {condition: builder_sandbox}
    when:
      bh: {sub: check}
    then:
      - same_result: {a: check_missed_checks, b: measure_missed_checks, compare: equal}
    traces_to: [G1, G3, R5, QBC-16]
    method: test
    deterministic: true

  - id: d3-AC6
    scenario: A finish without bh check is not refused
    covers: [6]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - planted: {plant: builder_never_ran_check, class: honest, where: working_tree}
    when:
      bh: {sub: run}
    then:
      - no_fact: {kind: launch_refused}
      - no_fact: {kind: stuck}
      - exit_code: {code: 0}
    traces_to: [R5, QBC-51]
    method: test
    deterministic: true

  # ---------------------------------------------------------------- d4
  - id: d4-AC1
    scenario: The authoritative packet is kept by digest in the orchestrator's directory and a launch leaves it unchanged
    covers: [1]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: launch_builder, item: toy_item}
    then:
      - file_unchanged: {target: orchestrator_packet}
      - needs_keyword: {reason: "that the stored packet is addressed by its digest in .brick-harness is an internal storage fact"}
    traces_to: [R5, QBC-24, QBC-48]
    method: test
    deterministic: true
    plan_gap: "the bullet prescribes the storage mechanism; the row asserts the digest of the orchestrator copy is stable across a launch"

  - id: d4-AC2
    scenario: The packet arrives once at SessionStart as additionalContext
    covers: [2]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - hook_input: {event: SessionStart, tool: none, agent_type: builder, packet: registered, target: none, touch: first}
    when:
      hook: {hook: H1}
    then:
      - field: {source: hook_output, path: additionalContext, op: present}
      - output_contains: {channel: additional_context, text: goal}
    traces_to: [R5, QBC-46, QBC-49]
    method: test
    deterministic: true

  - id: d4-AC3
    scenario: A second SessionStart for the same packet adds nothing
    covers: [2]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
      - hook_input: {event: SessionStart, tool: none, agent_type: builder, packet: registered, target: none, touch: repeat}
    when:
      hook: {hook: H1}
    then:
      - field: {source: hook_output, path: additionalContext, op: absent}
    traces_to: [R5, QBC-49]
    method: test
    deterministic: true
    plan_gap: "\"arrives once\" does not say what a repeat looks like; the row treats a repeat touch as absent context"

  - id: d4-AC4
    scenario: The launch prompt is a fixed line that names no goal
    covers: [2]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
      program_step: {step: launch_builder, item: toy_item}
    then:
      - field: {source: launch_args, path: prompt, op: present}
      - field: {source: launch_args, path: prompt, op: not_contains, value: goal}
    traces_to: [R5, QBC-46, QBC-49]
    method: test
    deterministic: true
    plan_gap: "the fixed line's text is not given; the row asserts it is present and that it holds no goal text"

  - id: d4-AC5
    scenario: A packet edited inside the clone changes nothing the program reads
    covers: [3]
    given:
      - repo: {name: toy, state: base}
      - packet: {fixture: toy_item, variant: valid}
    when:
