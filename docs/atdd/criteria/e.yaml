    then:
      - api_call: {service: github, operation: updateIssue, count: 1, with: "#12"}
    traces_to: [R8, G4, QBC-90]
    method: test
    deterministic: true

  - id: e3-AC3
    scenario: A line without a parent is refused with teaching
