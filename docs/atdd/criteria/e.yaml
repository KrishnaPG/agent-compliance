# Slice e, Intake (#12). Rows follow docs/atdd/catalog.yaml; leaf numbers come from `build.py --bullets`.
slice: e
criteria:
  - id: e1-AC1
    scenario: The decision form validates against GitHub's issue-form schema
    covers: [1]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      validate: {instance: templates/.github/ISSUE_TEMPLATE/decision.yml, schema: github_issue_form}
    then:
      - schema_valid: {valid: true}
    traces_to: [R8, QBC-87]
    method: lint
    deterministic: true

  - id: e1-AC2
    scenario: The slice form validates against GitHub's issue-form schema
    covers: [1]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      validate: {instance: templates/.github/ISSUE_TEMPLATE/slice.yml, schema: github_issue_form}
    then:
      - schema_valid: {valid: true}
    traces_to: [R8, QBC-87]
    method: lint
    deterministic: true

  - id: e1-AC3
    scenario: The defect form validates against GitHub's issue-form schema
    covers: [1]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      validate: {instance: templates/.github/ISSUE_TEMPLATE/defect.yml, schema: github_issue_form}
    then:
      - schema_valid: {valid: true}
    traces_to: [R8, QBC-87]
    method: lint
    deterministic: true

  - id: e1-AC4
    scenario: An invalid form is refused when the forms are written
    covers: [1]
    given:
      - repo: {name: project, state: no_issue_forms}
      - planted: {plant: form_without_body_type, class: defect, where: working_tree}
      - recorded_answer: {question: write_issue_forms, answer: approve}
    when:
      program_step: {step: write_forms}
    then:
      - refused: {by: program, wrong: "slice.yml fails GitHub's issue-form schema", right: "add a body of form fields to slice.yml", prevent: "validate every form against the issue-form schema before writing it"}
      - paths: {paths: [.github/ISSUE_TEMPLATE/slice.yml], exist: false}
    traces_to: [R8, P5, QBC-83]
    method: lint
    deterministic: true
    plan_gap: "the plan states no message for an invalid form; the row asserts the validator's error names the body path and teaches"

  - id: e1-AC5
    scenario: Each form declares parent, goal and acceptance fields
    covers: [2]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      scan: {paths: [templates/.github/ISSUE_TEMPLATE/decision.yml, templates/.github/ISSUE_TEMPLATE/slice.yml, templates/.github/ISSUE_TEMPLATE/defect.yml], kind: text, pattern: "id: (parent|goal|acceptance)\\b"}
    then:
      - scan_count: {op: eq, value: 9}
    traces_to: [R8, QBC-87, QBC-88]
    method: lint
    deterministic: true

  - id: e1-AC6
    scenario: Each of those fields is required in every form
    covers: [2]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      scan: {paths: [templates/.github/ISSUE_TEMPLATE/decision.yml, templates/.github/ISSUE_TEMPLATE/slice.yml, templates/.github/ISSUE_TEMPLATE/defect.yml], kind: text, pattern: "required: true"}
    then:
      - scan_count: {op: ge, value: 9}
    traces_to: [R8, QBC-87, QBC-88]
    method: lint
    deterministic: true

  - id: e1-AC7
    scenario: The parent field's description teaches the right way in every form
    covers: [3]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      scan: {paths: [templates/.github/ISSUE_TEMPLATE/decision.yml, templates/.github/ISSUE_TEMPLATE/slice.yml, templates/.github/ISSUE_TEMPLATE/defect.yml], kind: text, pattern: "pick one, or start a decision"}
    then:
      - scan_count: {op: ge, value: 3}
    traces_to: [R8, P5, QBC-88]
    method: lint
    deterministic: true
    plan_gap: "the plan does not give the right-way wording for the goal and acceptance descriptions; the row pins only the parent wording from QBC-88"

  - id: e1-AC8
    scenario: The goal and acceptance descriptions each carry a right-way line
    covers: [3]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      scan: {paths: [templates/.github/ISSUE_TEMPLATE/decision.yml, templates/.github/ISSUE_TEMPLATE/slice.yml, templates/.github/ISSUE_TEMPLATE/defect.yml], kind: text, pattern: "description:"}
    then:
      - scan_count: {op: ge, value: 9}
    traces_to: [R8, P5, QBC-83]
    method: lint
    deterministic: true
    plan_gap: "the wording of each description is not stated; the row asserts a description exists on each of the nine required fields"

  - id: e1-AC9
    scenario: Blank issues are off
    covers: [4]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      scan: {paths: [templates/.github/ISSUE_TEMPLATE/config.yml], kind: text, pattern: "blank_issues_enabled: false"}
    then:
      - scan_count: {op: eq, value: 1}
    traces_to: [R8, QBC-87]
    method: lint
    deterministic: true

  - id: e1-AC10
    scenario: With approval the forms are written into the project's .github
    covers: [5]
    given:
      - repo: {name: project, state: no_issue_forms}
      - recorded_answer: {question: write_issue_forms, answer: approve}
    when:
      program_step: {step: write_forms}
    then:
      - paths: {paths: [.github/ISSUE_TEMPLATE/decision.yml, .github/ISSUE_TEMPLATE/slice.yml, .github/ISSUE_TEMPLATE/defect.yml, .github/ISSUE_TEMPLATE/config.yml], exist: true}
    traces_to: [R8, G4, QBC-83]
    method: test
    deterministic: true

  - id: e1-AC11
    scenario: Without approval nothing is written
    covers: [5]
    given:
      - repo: {name: project, state: no_issue_forms}
      - recorded_answer: {question: write_issue_forms, answer: decline}
    when:
      program_step: {step: write_forms}
    then:
      - paths: {paths: [.github/ISSUE_TEMPLATE/*], exist: false}
    traces_to: [R8, G4, QBC-83]
    method: test
    deterministic: true

  - id: e1-AC12
    scenario: A second run writes nothing and asks nothing (the forms are written once)
    covers: [5]
    given:
      - repo: {name: project, state: no_issue_forms}
      - recorded_answer: {question: write_issue_forms, answer: approve}
    when:
      program_step: {step: write_forms, rerun: true}
    then:
      - file_unchanged: {target: project_config}
      - paths: {paths: [.github/ISSUE_TEMPLATE/slice.yml], exist: true}
    traces_to: [R8, G4, QBC-83]
    method: test
    deterministic: true

  - id: e1-AC13
    scenario: bug-record.md is gone and nothing names it
    covers: [6]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      scan: {paths: [skills/, agents/, templates/, harness/, README.md], kind: text, pattern: "bug-record"}
    then:
      - scan_count: {op: eq, value: 0}
      - paths: {paths: [templates/bug-record.md], exist: false}
    traces_to: [R8, QBC-83]
    method: lint
    deterministic: true

  - id: e2-AC1
    scenario: An agent-filed issue is created with its native parent in one request
    covers: [1]
    given:
      - repo: {name: project, state: tracking_issue_open}
      - recorded_api: {service: github, fixture: create_issue_with_parent}
    when:
      program_step: {step: file_issue}
    then:
      - api_call: {service: github, operation: createIssue, count: 1, with: parentIssueId}
      - api_call: {service: github, operation: addSubIssue, count: 0}
    traces_to: [R8, G4, QBC-88, QBC-89]
    method: test
    deterministic: true
    plan_gap: "the plan prescribes the GraphQL createIssue(parentIssueId) mechanism; the row asserts the observable result, one create request carrying the parent and no later link request"

  - id: e2-AC2
    scenario: At intake a form's parent field is linked as a sub-issue
    covers: [2]
    given:
      - repo: {name: project, state: tracking_issue_open}
      - recorded_api: {service: github, fixture: form_issue_with_parent_field}
    when:
      program_step: {step: intake_issue}
    then:
      - api_call: {service: github, operation: addSubIssue, count: 1, with: "#12"}
      - no_fact: {kind: gap}
    traces_to: [R8, G4, QBC-88, QBC-89]
    method: test
    deterministic: true

  - id: e2-AC3
    scenario: A parentless issue gets the parent message once
    covers: [3]
    given:
      - repo: {name: project, state: tracking_issue_open}
      - recorded_api: {service: github, fixture: parentless_issue}
    when:
      program_step: {step: intake_issue}
    then:
      - api_call: {service: github, operation: addComment, count: 1}
      - teaching: {channel: issue_comment, wrong: No parent decision, right: pick one, prevent: start a decision if this is a new capability}
      - output_contains: {channel: issue_comment, text: "No parent decision."}
      - output_contains: {channel: issue_comment, text: "Every issue sits under a decision's tracking issue: pick one, or start a decision if this is a new capability."}
    traces_to: [R8, G4, P12, QBC-88, QBC-89]
    method: test
    deterministic: true

  - id: e2-AC4
    scenario: A second intake of the same parentless issue does not repeat the message
    covers: [3]
    given:
      - repo: {name: project, state: tracking_issue_open}
      - recorded_api: {service: github, fixture: parentless_issue}
    when:
      program_step: {step: intake_issue, rerun: true}
    then:
      - api_call: {service: github, operation: addComment, count: 0}
    traces_to: [R8, G4, QBC-88]
    method: test
    deterministic: true

  - id: e2-AC5
    scenario: A defect in code with no tracking issue is pointed at the owner's maintenance issue, created on first need
    covers: [4]
    given:
      - repo: {name: project, state: defect_without_tracking_issue}
      - recorded_api: {service: github, fixture: no_maintenance_issue}
    when:
      program_step: {step: intake_issue}
    then:
      - api_call: {service: github, operation: createIssue, count: 1, with: maintenance}
      - teaching: {channel: issue_comment, wrong: No parent decision, right: use the standing maintenance tracking issue named in CODEOWNERS, prevent: add the code's owner to CODEOWNERS}
    traces_to: [R8, G4, QBC-88]
    method: test
    deterministic: true
    plan_gap: "the plan does not give the wording naming the maintenance issue; the row requires the message to name it and its CODEOWNERS source"

  - id: e2-AC6
    scenario: The owner's existing maintenance issue is reused, not created again
    covers: [4]
    given:
