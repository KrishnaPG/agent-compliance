      - recorded_api: {service: github, fixture: maintenance_issue_exists}
    when:
      program_step: {step: intake_issue}
    then:
      - api_call: {service: github, operation: createIssue, count: 0}
      - api_call: {service: github, operation: addSubIssue, count: 1}
    traces_to: [R8, G4, QBC-88]
    method: test
    deterministic: true

  - id: e2-AC7
    scenario: Intake runs offline of GitHub Actions and the repo holds no workflow
    covers: [5]
    given:
      - repo: {name: project, state: tracking_issue_open}
      - recorded_api: {service: github, fixture: parentless_issue}
      - host: {condition: network_off}
    when:
      bh: {sub: intake}
    then:
      - exit_code: {code: 0}
      - paths: {paths: [.github/workflows/*], exist: false}
    traces_to: [R8, P12, QBC-89]
    method: test
    deterministic: true

  - id: e2-AC8
    scenario: A decision's tracking issue links its record and the record links the issue
    spec_ref: [L1.link-to-the-work]
    given:
      - repo: {name: project, state: decision_record_written}
      - recorded_api: {service: github, fixture: create_issue_with_parent}
    when:
      program_step: {step: file_issue, item: decision_item}
    then:
      - api_call: {service: github, operation: createIssue, count: 1, with: docs/decisions/}
      - field: {source: decision_record, path: tracking_issue, op: present}
    traces_to: [R8, QBC-87]
    method: test
    deterministic: true
    plan_gap: "the plan does not describe the record-to-issue link; the row asserts the created issue body names the record path and the record names the issue"

  - id: e3-AC1
    scenario: The Known issues list is found by its label
    covers: [1]
    given:
