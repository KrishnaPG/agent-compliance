    when:
      program_step: {step: add_known_issue}
    then:
      - api_call: {service: github, operation: listIssues, count: 1, with: label}
      - api_call: {service: github, operation: updateIssue, count: 1}
    traces_to: [R8, G4, QBC-90]
    method: test
    deterministic: true
    plan_gap: "the label name is not stated; the row asserts the lookup request carries a label filter and no issue title"

  - id: e3-AC2
    scenario: A new line names its parent
