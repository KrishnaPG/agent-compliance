# Slice b, Harness core (#9). Rows follow docs/atdd/catalog.yaml; leaf numbers come from `build.py --bullets`.
slice: b
acceptance:
- id: b1-AC1
  scenario: Each (ref, mode) is measured in its own shared clone, and two measured at once do not share one
  covers:
  - 1
  given:
  - repo:
      name: toy
      state: base
  - recorded_model:
      fixture: toy_honest
  when:
    bh:
      sub: measure
      parallel: 2
  then:
  - git:
      assert: clone_is_shared_from_base
  - git:
      assert: no_remote_fetch
  - same_result:
      a: result_ref_a
      b: result_ref_b
      compare: separate
  traces_to:
  - R4
  - QBC-15
  - QBC-31
  verification: test
  deterministic: true
  plan_gap: bullet prescribes git clone --shared; the row asserts the clone is shared from base and results are separate
- id: b1-AC2
  scenario: A gutted test that is not the item's own test still makes the candidate unmet (all tests are overlaid)
  covers:
  - 2
  given:
  - repo:
      name: toy
      state: base
  - planted:
      plant: gutted_other_test
      class: gaming
  when:
    bh:
      sub: measure
  then:
  - met:
      status: unmet
  - fact:
      kind: diff
      detail: M tests/
  - teaching:
      channel: fact
      wrong: tests/ file edited by the builder
      right: restore the test to its plan-commit content
      prevent: protect tests/ so edits to it have no effect
  traces_to:
  - R4
  - P6
  - QBC-15
  verification: test
  deterministic: true
  plan_gap: plan states no teaching text for this unmet result; the teaching assertion uses the protected-path wording of QBC-15
