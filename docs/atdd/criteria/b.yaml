    - field: {source: "result_json", path: "facts[*].item", op: "eq", value: "toy_item"}
    - teaching: {channel: "stdout", wrong: "toy_item-AC1 failed an assertion", right: "make toy_item-AC1 pass without editing tests/", prevent: "run bh check before finishing"}
  traces_to: ["R4", "QBC-35", "QBC-51"]
  verification: test
  deterministic: true
