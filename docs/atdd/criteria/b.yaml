- id: b2-AC18
  scenario: "A measurement names its schema version and command and gives a verdict for each acceptance criterion"
  spec_ref: ["L5.verdict-for-each-acceptance-id-and-facts", "common.any-json-output"]
  given:
    - repo: {name: "toy", state: "base"}
    - packet: {fixture: "toy_item", variant: "valid"}
    - planted: {plant: "honest_commit", class: "honest"}
  when:
    bh: {sub: "measure"}
  then:
    - met: {status: "met"}
    - field: {source: "result_json", path: "schema_version", op: "matches", value: "^\\d+\\.\\d+\\.\\d+$"}
    - field: {source: "result_json", path: "command", op: "eq", value: "measure"}
    - field: {source: "result_json", path: "items[*].acceptance[*].id", op: "present"}
    - field: {source: "result_json", path: "items[*].acceptance[*].status", op: "eq", value: "met"}
  traces_to: ["R4", "QBC-35", "QBC-51"]
  verification: test
  deterministic: true
- id: b2-AC19
  scenario: "One failing acceptance criterion is unmet by itself and its fact names the item"
  spec_ref: ["L5.verdict-for-each-acceptance-id-and-facts"]
  given:
    - repo: {name: "toy", state: "base"}
    - packet: {fixture: "toy_item", variant: "valid"}
    - planted: {plant: "one_criterion_failing", class: "defect"}
  when:
    bh: {sub: "measure"}
  then:
    - met: {status: "unmet"}
