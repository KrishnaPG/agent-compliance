  - id: c4-AC5
    scenario: A shrunk strict-tsconfig include list yields the ratchet fact
    spec_ref: [L2.ratchet-baselines]
    covers: [1, 2]
    given:
      - repo: {name: node_toy, state: baselines_adopted}
