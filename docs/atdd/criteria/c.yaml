    method: test
    deterministic: true

  - id: c5-AC1
    scenario: The parity report covers HO-02, ID-15 and RL-08 in Python and TypeScript
    covers: [1]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      bh: {sub: check, args: [parity]}
    then:
      - fact: {kind: parity, detail: HO-02}
      - fact: {kind: parity, detail: ID-15}
      - fact: {kind: parity, detail: RL-08}
      - fact: {kind: parity, detail: python}
      - fact: {kind: parity, detail: typescript}
    traces_to: [R7, P11, QBC-8, QBC-23]
    method: test
    deterministic: true
    plan_gap: "the existing planted snapshots are not identified by path; the row relies on the committed ones for those three rules and assumes the parity command is a check argument"

