  - id: c4-AC7
    scenario: The opposite direction of each baseline yields no ratchet fact
    spec_ref: [L2.ratchet-baselines]
    covers: [3]
    given:
      - repo: {name: toy, state: baselines_adopted}
      - planted: {plant: baselines_shrunk_and_include_list_grown, class: honest, where: candidate_commit}
    when:
