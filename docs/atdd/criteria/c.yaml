# Slice c, Convention over configuration (#10). Rows follow docs/atdd/catalog.yaml; leaf numbers come from `build.py --bullets`.
slice: c
criteria:
  - id: c1-AC1
    scenario: The test and verify entry points are inferred from a justfile
    covers: [1]
    given:
      - repo: {name: toy, state: justfile_recipes}
    when:
      program_step: {step: infer_config}
    then:
      - fact: {kind: inferred, detail: justfile}
    traces_to: [G6, P9, QBC-2, QBC-60]
    method: test
    deterministic: true

  - id: c1-AC2
    scenario: The entry points are inferred from a Makefile when no justfile exists
    covers: [1]
    given:
      - repo: {name: toy, state: makefile_targets}
    when:
      program_step: {step: infer_config}
    then:
      - fact: {kind: inferred, detail: Makefile}
    traces_to: [G6, P9, QBC-2, QBC-60]
    method: test
    deterministic: true

  - id: c1-AC3
    scenario: The entry points are inferred from package.json scripts
    covers: [1]
    given:
      - repo: {name: node_toy, state: package_json_scripts}
    when:
      program_step: {step: infer_config}
    then:
      - fact: {kind: inferred, detail: package.json}
    traces_to: [G6, P9, QBC-2, QBC-60]
    method: test
    deterministic: true

  - id: c1-AC4
    scenario: The entry points are inferred from pyproject when nothing else declares them
    covers: [1]
    given:
      - repo: {name: toy, state: pyproject_only}
    when:
      program_step: {step: infer_config}
    then:
      - fact: {kind: inferred, detail: pyproject.toml}
    traces_to: [G6, P9, QBC-2, QBC-60]
    method: test
    deterministic: true

  - id: c1-AC5
    scenario: Languages are inferred from the tracked files with the linters' own mappings
    covers: [2]
    given:
      - repo: {name: node_toy, state: mixed_python_typescript}
    when:
      program_step: {step: infer_config}
    then:
      - fact: {kind: inferred, detail: git ls-files}
    traces_to: [G6, P9, QBC-2, QBC-61]
    method: test
    deterministic: true
    plan_gap: "the leaf names the mapping source (the linters' own mappings) but no file; the row asserts the fact names the tracked-file listing"

  - id: c1-AC6
    scenario: The dependency command comes from the Python lockfile
    covers: [3]
    given:
      - repo: {name: toy, state: uv_lockfile}
    when:
      program_step: {step: infer_config}
    then:
      - fact: {kind: inferred, detail: uv.lock}
      - field: {source: config_effective, path: dependency_command, op: contains, value: uv add}
    traces_to: [G6, P9, QBC-2, QBC-61]
    method: test
    deterministic: true
    plan_gap: "the effective-config key name for the dependency command is not named by the plan"

  - id: c1-AC7
    scenario: The dependency command comes from a JavaScript lockfile
    covers: [3]
    given:
      - repo: {name: node_toy, state: pnpm_lockfile}
    when:
      program_step: {step: infer_config}
    then:
      - fact: {kind: inferred, detail: pnpm-lock.yaml}
      - field: {source: config_effective, path: dependency_command, op: contains, value: pnpm add}
    traces_to: [G6, P9, QBC-2, QBC-61]
    method: test
    deterministic: true
    plan_gap: "the effective-config key name for the dependency command is not named by the plan"

  - id: c1-AC8
    scenario: The builder's own test location comes from pytest testpaths
    covers: [4]
    given:
      - repo: {name: toy, state: pytest_testpaths}
    when:
      program_step: {step: infer_config}
    then:
      - fact: {kind: inferred, detail: pyproject.toml}
      - field: {source: config_effective, path: builder_test_paths, op: contains, value: tests}
    traces_to: [G6, P9, QBC-2, QBC-61]
    method: test
    deterministic: true
    plan_gap: "the effective-config key name for the builder's test location is not named by the plan"

  - id: c1-AC9
    scenario: The builder's own test location comes from the JavaScript test runner config
    covers: [4]
    given:
      - repo: {name: node_toy, state: runner_config}
    when:
      program_step: {step: infer_config}
    then:
      - fact: {kind: inferred, detail: vitest.config}
      - field: {source: config_effective, path: builder_test_paths, op: present}
    traces_to: [G6, P9, QBC-2, QBC-61]
    method: test
    deterministic: true
    plan_gap: "the JS test runner is not named; the fixture picks one and the row follows it"

  - id: c1-AC10
    scenario: Owners are inferred from CODEOWNERS
    covers: [5]
    given:
      - repo: {name: toy, state: codeowners_present}
    when:
      program_step: {step: infer_config}
    then:
      - fact: {kind: inferred, detail: CODEOWNERS}
    traces_to: [G6, P9, QBC-63]
    method: test
    deterministic: true

  - id: c1-AC11
    scenario: Owners are inferred from OpenAPI tags
    covers: [5]
    given:
      - repo: {name: toy, state: openapi_tags}
    when:
      program_step: {step: infer_config}
    then:
      - fact: {kind: inferred, detail: openapi}
    traces_to: [G6, P9, QBC-63]
    method: test
    deterministic: true

  - id: c1-AC12
    scenario: Every inferred value is a fact naming its source file and the run report lists it
    covers: [6]
    given:
      - repo: {name: node_toy, state: package_json_scripts}
    when:
      bh: {sub: run}
    then:
      - fact: {kind: inferred, detail: package.json}
      - no_fact: {kind: not_declared}
    traces_to: [G6, P9, G3, QBC-98]
    method: test
    deterministic: true

  - id: c1-AC13
    scenario: bh run works on the toy with no .brick-harness/config.json
    covers: [7]
    given:
      - repo: {name: toy, state: no_harness_config}
    when:
      bh: {sub: run}
    then:
      - exit_code: {code: 0}
      - paths: {paths: [.brick-harness/config.json], exist: false}
    traces_to: [G6, P9, G3, QBC-2]
    method: test
    deterministic: true

  - id: c1-AC14
    scenario: bh run works on a Node fixture with no .brick-harness/config.json
    covers: [7]
    given:
      - repo: {name: node_toy, state: no_harness_config}
    when:
      bh: {sub: run}
    then:
      - exit_code: {code: 0}
      - paths: {paths: [.brick-harness/config.json], exist: false}
    traces_to: [G6, P9, G3, QBC-2]
    method: test
    deterministic: true

  - id: c1-AC15
    scenario: bh-init is gone and nothing names it
    covers: [8]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      scan: {paths: [bin/, skills/, harness/, docs/, README.md], kind: text, pattern: "bh-init"}
    then:
      - paths: {paths: [bin/bh-init], exist: false}
      - scan_count: {op: eq, value: 0}
    traces_to: [G6, P9, QBC-61]
    method: lint
    deterministic: true
    plan_gap: "docs/plan and docs/atdd name bh-init as history; the scan scope needs them excluded or the count can never reach 0"

  - id: c2-AC1
    scenario: On a fixture without CODEOWNERS exactly one question is asked
    covers: [1]
    given:
      - repo: {name: toy, state: no_codeowners}
      - recorded_answer: {question: owner_of_unowned_paths, answer: decline}
    when:
      program_step: {step: ask_once}
    then:
      - questions_asked: {count: 1}
      - paths: {paths: [CODEOWNERS], exist: false}
    traces_to: [P9, QBC-61]
    method: test
    deterministic: true

  - id: c2-AC2
    scenario: An approved answer is written to CODEOWNERS and to no plugin file
    covers: [2]
    given:
      - repo: {name: toy, state: no_codeowners}
      - recorded_answer: {question: owner_of_unowned_paths, answer: approve}
    when:
      program_step: {step: ask_once}
    then:
      - paths: {paths: [CODEOWNERS], exist: true}
      - paths: {paths: [.brick-harness/*], exist: false}
      - file_unchanged: {target: plugin_files}
    traces_to: [P9, G6, QBC-63]
    method: test
    deterministic: true

  - id: c2-AC3
    scenario: An approved answer lands in an OpenAPI tag when the project keeps owners there
    covers: [2]
    given:
      - repo: {name: toy, state: openapi_without_owner_tag}
      - recorded_answer: {question: owner_of_unowned_paths, answer: approve}
    when:
      program_step: {step: ask_once}
    then:
      - paths: {paths: [.brick-harness/*], exist: false}
      - file_unchanged: {target: plugin_files}
      - file_contains: {path: openapi.yaml, text: tags}
    traces_to: [G6, QBC-63]
    method: test
    deterministic: true

  - id: c2-AC4
    scenario: An approved answer lands as a recipe line when the project keeps it there
    covers: [2]
    given:
      - repo: {name: toy, state: recipe_without_owner_line}
      - recorded_answer: {question: owner_of_unowned_paths, answer: approve}
    when:
      program_step: {step: ask_once}
    then:
      - paths: {paths: [.brick-harness/*], exist: false}
      - file_unchanged: {target: plugin_files}
      - file_contains: {path: justfile, text: owner}
    traces_to: [G6, QBC-63]
    method: test
    deterministic: true

  - id: c2-AC5
    scenario: A rerun after the answer asks nothing and changes nothing
    covers: [3]
    given:
      - repo: {name: toy, state: codeowners_written_by_answer}
    when:
      program_step: {step: ask_once, rerun: true}
    then:
      - questions_asked: {count: 0}
      - file_unchanged: {target: project_config}
    traces_to: [P9, QBC-61]
    method: test
    deterministic: true

  - id: c3-AC1
    scenario: Declining the presets writes nothing
    covers: [5]
    given:
      - repo: {name: toy, state: no_presets}
      - recorded_answer: {question: write_presets, answer: decline}
    when:
      program_step: {step: apply_presets}
    then:
      - file_unchanged: {target: project_config}
      - git: {assert: no_git_hook_installed}
    traces_to: [R7, G2, QBC-62]
    method: test
    deterministic: true

  - id: c3-AC2
    scenario: Approved ruff presets are written into pyproject.toml
    covers: [1]
    given:
      - repo: {name: toy, state: no_presets}
      - recorded_answer: {question: write_presets, answer: approve}
    when:
      program_step: {step: apply_presets}
    then:
      - paths: {paths: [pyproject.toml], exist: true}
      - file_contains: {path: pyproject.toml, text: DTZ}
      - file_contains: {path: pyproject.toml, text: "S105"}
      - file_contains: {path: pyproject.toml, text: PLR2004}
      - file_contains: {path: pyproject.toml, text: TID251}
      - file_contains: {path: pyproject.toml, text: msg}
    traces_to: [R7, G2, QBC-4, QBC-16, QBC-19, QBC-81]
    method: test
    deterministic: true
    plan_gap: "the bullet prescribes where the fragments go (file content); the row asserts the file exists and flags the content part"

  - id: c3-AC3
    scenario: Approved ESLint or oxlint presets carry no-restricted rules with a message
    covers: [2]
    given:
      - repo: {name: node_toy, state: no_presets}
      - recorded_answer: {question: write_presets, answer: approve}
    when:
      program_step: {step: apply_presets}
    then:
      - file_contains: {path: eslint.config.js, text: no-restricted-}
      - file_contains: {path: eslint.config.js, text: message}
    traces_to: [R7, G2, QBC-5, QBC-57]
    method: test
    deterministic: true
    plan_gap: "the bullet prescribes file content; the row cannot name the ESLint or oxlint file because the plan leaves the choice open"

  - id: c3-AC4
    scenario: Approved sqlfluff presets enable AM04
    covers: [3]
    given:
      - repo: {name: toy, state: sql_files_no_presets}
      - recorded_answer: {question: write_presets, answer: approve}
    when:
      program_step: {step: apply_presets}
    then:
      - paths: {paths: [.sqlfluff], exist: true}
      - file_contains: {path: .sqlfluff, text: AM04}
    traces_to: [R7, G2, QBC-4]
    method: test
    deterministic: true
    plan_gap: "the bullet prescribes file content"

  - id: c3-AC5
    scenario: Approved TypeScript presets turn strict on
    covers: [4]
    given:
      - repo: {name: node_toy, state: no_presets}
      - recorded_answer: {question: write_presets, answer: approve}
    when:
      program_step: {step: apply_presets}
    then:
      - paths: {paths: [tsconfig.json], exist: true}
      - file_contains: {path: tsconfig.json, text: '"strict": true'}
    traces_to: [R7, G2, QBC-4]
    method: test
    deterministic: true
    plan_gap: "the bullet prescribes file content"

  - id: c3-AC6
    scenario: With approval the checks are also written as local pre-commit hooks pinned in dev dependencies
    covers: [5]
    given:
