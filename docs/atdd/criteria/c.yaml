  - id: c4-AC6
    scenario: A changed pinned test hash yields the ratchet fact
    spec_ref: [L2.ratchet-baselines]
    covers: [1, 2]
    given:
      - repo: {name: toy, state: baselines_adopted}
      - planted: {plant: pinned_test_hash_changed, class: gaming, where: candidate_commit}
