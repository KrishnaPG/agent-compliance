  - id: c3-AC7
    scenario: Declining the pre-commit hooks writes no pre-commit config
    covers: [5]
    given:
      - repo: {name: toy, state: no_presets}
      - recorded_answer: {question: write_pre_commit_hooks, answer: decline}
    when:
      program_step: {step: apply_presets}
    then:
      - paths: {paths: [.pre-commit-config.yaml], exist: false}
    traces_to: [R7, G2, QBC-62]
    method: test
    deterministic: true

  - id: c3-AC8
    scenario: The project's test recipe runs pre-commit over all files
    covers: [6]
    given:
      - repo: {name: toy, state: presets_applied}
    when:
      entry_point: {entry: project_test}
    then:
      - output_contains: {channel: stdout, text: "pre-commit run --all-files"}
    traces_to: [R7, G2, QBC-62]
    method: test
    deterministic: true
    plan_gap: "assumes the recipe echoes its command; no other observable names the pre-commit invocation"

  - id: c3-AC9
    scenario: Applying the presets installs no git hook
    covers: [7]
    given:
      - repo: {name: toy, state: no_presets}
      - recorded_answer: {question: write_pre_commit_hooks, answer: approve}
    when:
      program_step: {step: apply_presets}
    then:
      - git: {assert: no_git_hook_installed}
    traces_to: [P4, QBC-19]
    method: test
    deterministic: true

  - id: c3-AC10
    scenario: With Claude Code absent the test recipe reports a planted naive datetime
    covers: [8]
    given:
      - repo: {name: toy, state: presets_applied}
      - host: {condition: claude_code_absent}
      - planted: {plant: naive_datetime, class: violation, where: working_tree}
    when:
      entry_point: {entry: project_test}
    then:
      - exit_code: {code: 1}
      - teaching: {channel: stdout, wrong: "DTZ005 datetime without tzinfo", right: "pass tz=timezone.utc", prevent: "run the project test recipe so ruff DTZ reports it before commit"}
    traces_to: [R7, G2, P4, QBC-57, QBC-81]
    method: test
    deterministic: true
    plan_gap: "the plan states no teaching text for the DTZ miss; the substrings follow ruff's own message"

  - id: c3-AC11
    scenario: The same recipe passes on the tree without the planted datetime
    covers: [8]
    given:
      - repo: {name: toy, state: presets_applied}
      - host: {condition: claude_code_absent}
      - planted: {plant: timezone_aware_datetime, class: honest, where: working_tree}
    when:
      entry_point: {entry: project_test}
    then:
      - exit_code: {code: 0}
    traces_to: [R7, G2, QBC-81]
    method: test
    deterministic: true

  - id: c3-AC12
    scenario: The measurer holds no call to a linter or checker of its own
    covers: [9]
    given:
      - repo: {name: plugin, state: candidate}
    when:
      scan: {paths: [bin/bh-measure], kind: text, pattern: "ruff|eslint|oxlint|sqlfluff|ast-grep|pre-commit"}
    then:
      - scan_count: {op: eq, value: 0}
    traces_to: [G2, QBC-62]
    method: lint
    deterministic: true
    plan_gap: "the bullet prescribes who runs checks; absence of tool names in the measurer is the nearest static observable"

  - id: c4-AC1
    scenario: Baselines are generated at adoption
    spec_ref: [L2.ratchet-baselines]
    covers: [1]
    given:
      - repo: {name: toy, state: presets_applied}
    when:
      program_step: {step: generate_baselines}
    then:
      - field: {source: baseline_file, path: per-file-ignores, op: present}
      - field: {source: baseline_file, path: sqlfluffignore, op: present}
      - field: {source: baseline_file, path: ignore_imports, op: present}
      - field: {source: baseline_file, path: strict_include_list, op: present}
      - field: {source: baseline_file, path: pinned_test_hashes, op: present}
    traces_to: [R5, QBC-19]
    method: test
    deterministic: true
    plan_gap: "the baseline file's field names are not named by the plan; the row uses the names the leaf lists"

  - id: c4-AC2
    scenario: Growth of per-file-ignores against the merge base yields the ratchet fact
    spec_ref: [L2.ratchet-baselines]
    covers: [1, 2]
    given:
      - repo: {name: toy, state: baselines_adopted}
      - planted: {plant: per_file_ignores_grown, class: gaming, where: candidate_commit}
    when:
      bh: {sub: check}
    then:
      - fact: {kind: ratchet_growth, detail: per-file-ignores}
      - teaching: {channel: fact, wrong: "per-file-ignores grew against the merge base", right: "fix the finding and remove the added per-file-ignores entry", prevent: "ratchet_growth fact compares per-file-ignores with the merge base on every check"}
    traces_to: [P11, QBC-8]
    method: test
    deterministic: true
    plan_gap: "b4's fact kind is taken to be ratchet_growth; its teaching text is not stated"

  - id: c4-AC3
    scenario: Growth of .sqlfluffignore against the merge base yields the ratchet fact
    spec_ref: [L2.ratchet-baselines]
    covers: [1, 2]
    given:
      - repo: {name: toy, state: baselines_adopted}
      - planted: {plant: sqlfluffignore_grown, class: gaming, where: candidate_commit}
    when:
      bh: {sub: check}
    then:
      - fact: {kind: ratchet_growth, detail: sqlfluffignore}
      - teaching: {channel: fact, wrong: ".sqlfluffignore grew against the merge base", right: "fix the SQL and remove the added .sqlfluffignore line", prevent: "ratchet_growth fact compares .sqlfluffignore with the merge base on every check"}
    traces_to: [P11, QBC-8]
    method: test
    deterministic: true
    plan_gap: "the plan states no teaching text for the ratchet fact"

  - id: c4-AC4
    scenario: Growth of the generated ignore_imports yields the ratchet fact
    spec_ref: [L2.ratchet-baselines]
    covers: [1, 2]
    given:
      - repo: {name: toy, state: baselines_adopted}
      - planted: {plant: ignore_imports_grown, class: gaming, where: candidate_commit}
    when:
      bh: {sub: check}
