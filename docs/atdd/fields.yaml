# The d0 field names: the only field paths of the packet, the result JSON, its jobs and the
# config that acceptance rows may read. build.py rejects any other path (except with op
# absent) and renders docs/atdd/d0-fields.md from this file.
#
# path syntax: [*] = every element; `*` as a whole segment = any key (models.*, right_way.*).
# a selector [key=value] picks the element whose key is value; metrics[id=x][window=current] picks by two keys.

schemas:
  packet: "the work packet, one JSON file per item, harness/schema/packet.schema.json"
  result: "the JSON every bh command and program step prints, harness/schema/result.schema.json, one $defs per command"
  jobs: "one entry of the result's jobs[*], harness/schema/result.schema.json $defs/job"
  config: ".brick-harness/config.json overrides over the plugin defaults, harness/schema/harness.config.schema.json"

fields:
  # packet
  - {schema: packet, path: schema_version, type: string, meaning: "version of the packet schema the file follows"}
  - {schema: packet, path: id, type: string, meaning: "the item id; names the packet"}
  - {schema: packet, path: parent_issue, type: integer, meaning: "tracker issue number of the item's parent, when the project has a tracker"}
  - {schema: packet, path: kind, type: "enum: slice, defect", default: slice, meaning: "slice, or defect for a fix of a recorded defect (a sub-issue under parent)"}
  - {schema: packet, path: parent, type: integer, meaning: "defect packets only: the GitHub issue number of the slice or decision the defect sits under (intake I2)"}
  - {schema: packet, path: found_by, type: "enum: planner, judge, proposer, test_author, builder, reviewer, person", meaning: "defect packets only: who found the defect, a jobs[*].role or person; the regression row is written by that agent when it is not the builder, otherwise by the test_author job"}
  - {schema: packet, path: tier, type: "enum: mechanical, design-affecting", meaning: "the tier derived from declared paths and the diff (d5)"}
  - {schema: packet, path: goal, type: string, meaning: "the intent and why, with no design"}
  - {schema: packet, path: "applies[*].id", type: string, meaning: "a G, P, R or QBC id from spec section 0; every principle is always included"}
  - {schema: packet, path: "applies[*].text", type: string, meaning: "that item's text, copied verbatim from spec section 0"}
  - {schema: packet, path: "constraints.decisions[*].id", type: string, meaning: "id of a cited decision line"}
  - {schema: packet, path: "constraints.decisions[*].text", type: string, meaning: "the cited decision line's text, verbatim"}
  - {schema: packet, path: "constraints.owners[*]", type: string, meaning: "an owner whose paths the item touches"}
  - {schema: packet, path: "constraints.interfaces[*]", type: string, meaning: "a published interface of a touched owner"}
  - {schema: packet, path: "constraints.declared_paths[*]", type: string, meaning: "a path the builder may change"}
  - {schema: packet, path: constraints.limits, type: object, meaning: "the limits that bind the item, key to effective value"}
  - {schema: packet, path: "acceptance[*].id", type: string, meaning: "the acceptance criterion id, e.g. d0-AC1"}
  - {schema: packet, path: "acceptance[*].scenario", type: string, meaning: "the criterion's one-line scenario title"}
  - {schema: packet, path: "acceptance[*].traces_to", type: "array of string", meaning: "where the criterion comes from: a project document file:line, or the G, P, R or QBC ids it proves"}
  - {schema: packet, path: "acceptance[*].verification", type: "enum: test, lint, fitness, measure", meaning: "how the criterion is verified (ISO/IEC/IEEE 29148)"}
  - {schema: packet, path: "verifier.checks[*]", type: string, meaning: "an exact check the measurer and bh check run"}
  - {schema: packet, path: "verifier.rules[*].id", type: string, meaning: "a rule id from the standards data (g1) that binds the touched files"}
  - {schema: packet, path: "verifier.rules[*].message", type: string, meaning: "that rule's teaching message"}
  - {schema: packet, path: "verifier.baselines[*]", type: string, meaning: "a ratchet baseline file present at the plan commit"}
  - {schema: packet, path: "verifier.targets[*].id", type: string, meaning: "a measurer target's id"}
  - {schema: packet, path: "verifier.targets[*].item", type: string, meaning: "the item the target measures"}
  - {schema: packet, path: "verifier.targets[*].metric", type: string, meaning: "the measured metric"}
  - {schema: packet, path: "verifier.targets[*].op", type: string, meaning: "the comparison, as in harness/schema/targets.schema.json"}
  - {schema: packet, path: "verifier.targets[*].value", type: number, meaning: "the threshold"}
  - {schema: packet, path: "verifier.targets[*].unit", type: string, meaning: "the threshold's unit"}
  - {schema: packet, path: "verifier.acceptance_paths[*]", type: string, meaning: "the test author's acceptance test file in the project's own framework, protected from the builder"}
  - {schema: packet, path: "paved_road.test_paths[*]", type: string, meaning: "where the builder puts its own tests"}
  - {schema: packet, path: paved_road.dependency_command, type: string, meaning: "how the builder adds a dependency"}
  - {schema: packet, path: paved_road.check_command, type: string, meaning: "the self-check command, bh check"}
  - {schema: packet, path: definition_of_done, type: string, meaning: "every acceptance criterion met by the measurer"}
  - {schema: packet, path: "overflow[*].path", type: string, meaning: "a file in the packet directory holding text moved out over the size cap"}
  # result
  - {schema: result, path: schema_version, type: string, meaning: "version of the result schema the JSON follows"}
  - {schema: result, path: command, type: "enum: run, measure, check, step, intake, merge, decide, gaps, owners, metrics, vet, map", meaning: "the bh command or program step that printed the result"}
  - {schema: result, path: step, type: string, meaning: "the program step that printed the result, when command is step (assemble_packet, validate_packet, render_packet, ...)"}
  - {schema: result, path: packet_sha256, type: string, meaning: "sha256 of the packet a run, measure or check read"}
  - {schema: result, path: "items[*].id", type: string, meaning: "the item id"}
  - {schema: result, path: "items[*].status", type: "enum: met, unmet, stuck, not_checked", meaning: "the measurer's verdict for the item"}
  - {schema: result, path: "items[*].tier", type: "enum: mechanical, design-affecting", meaning: "the tier the item ran at"}
  - {schema: result, path: "items[*].out", type: string, meaning: "the item's output dir <measure_out>/<item>/<sha12>-<slot>"}
  - {schema: result, path: "items[*].acceptance[*].id", type: string, meaning: "an acceptance criterion id of the item"}
  - {schema: result, path: "items[*].acceptance[*].status", type: "enum: met, unmet", meaning: "the measurer's verdict for that criterion"}
  - {schema: result, path: "checks_run[*]", type: string, meaning: "an exact check a measure or check command ran (command measure, check)"}
  - {schema: result, path: "checks_missed[*]", type: string, meaning: "a check of checks_run that exited non-zero: a missed check, whose messages go back to the builder (QBC-51, QBC-55; command measure, check)"}
  - {schema: result, path: "facts[*].kind", type: string, meaning: "one of the catalog's fact kinds"}
  - {schema: result, path: "facts[*].detail", type: string, meaning: "text naming the file, key or value the fact is about"}
  - {schema: result, path: "facts[*].item", type: string, meaning: "the item the fact belongs to"}
  - {schema: result, path: "gaps[*].id", type: string, meaning: "a gap id, unique in the run (command gaps)"}
  - {schema: result, path: "unmerged[*]", type: string, meaning: "an item left unmerged (command merge)"}
  - {schema: result, path: admitted_total, type: integer, meaning: "items admitted (command intake)"}
  - {schema: result, path: "options[*].id", type: string, meaning: "an option id (command decide)"}
  - {schema: result, path: "options[*].targets", type: array, meaning: "the targets scored for the option (command decide)"}
  - {schema: result, path: "options[*].rules[*].id", type: string, meaning: "a rule id scored for the option (command decide)"}
  - {schema: result, path: "options[*].rules[*].verdict", type: "enum: pass, fail, unknown", meaning: "the option's verdict on that rule (command decide)"}
  - {schema: result, path: recommended, type: string, meaning: "the option id the judge recommends (command decide)"}
  - {schema: result, path: "skipped[*].number", type: integer, meaning: "an issue number intake skipped (command intake)"}
  - {schema: result, path: "map[*].old_id", type: string, meaning: "an old catalog rule id that is mapped (command map)"}
  - {schema: result, path: "map[*].new_id", type: string, meaning: "the standard or house-rule id that old_id maps to (command map)"}
  - {schema: result, path: owner, type: string, meaning: "the owner of the asked path or topic (command owners)"}
  - {schema: result, path: package, type: string, meaning: "the owner's package (command owners)"}
  - {schema: result, path: "database_roles[*]", type: string, meaning: "the owner's database roles (command owners)"}
  - {schema: result, path: "operations[*]", type: string, meaning: "the owner's published operations (command owners)"}
  - {schema: result, path: "sources[*]", type: string, meaning: "the standard files the answer was read from (command owners)"}
  - {schema: result, path: "metrics[*].id", type: "enum: change_failure_rate, lead_time_for_changes, tokens_per_met_slice, measurer_rounds", meaning: "the metric: the DORA names change_failure_rate and lead_time_for_changes, tokens_per_met_slice (jobs[*].tokens summed per met slice) or measurer_rounds (per met slice its highest builder jobs[*].round, summed) (command metrics)"}
  - {schema: result, path: "metrics[*].window", type: "enum: current, baseline", meaning: "the history the metric is computed over: the current history, or the baseline written before the change (command metrics)"}
  - {schema: result, path: "metrics[*].value", type: number, meaning: "the metric value; change_failure_rate is merged slices that later get a defect sub-issue as a share, lead_time_for_changes is slice sub-issue opening to merge (command metrics)"}
  - {schema: result, path: "metrics[*].unit", type: "enum: ratio, hours, tokens, count", meaning: "the value's unit: ratio for change_failure_rate, hours for lead_time_for_changes, tokens for tokens_per_met_slice, count for measurer_rounds (command metrics)"}
  - {schema: result, path: "api_results[*].id", type: "enum: scorecard, deps.dev, osv", meaning: "the service whose response is recorded (command vet)"}
  - {schema: result, path: "api_results[*].body", type: object, meaning: "that service's recorded response object, with no verdict added (command vet)"}
  # jobs
  - {schema: jobs, path: "jobs[*].id", type: string, meaning: "the job id, unique in the run"}
  - {schema: jobs, path: "jobs[*].kind", type: "enum: agent, program_step", meaning: "whether an agent or a program step ran the job"}
  - {schema: jobs, path: "jobs[*].role", type: "enum: planner, judge, proposer, test_author, builder, reviewer", meaning: "the agent's role; agent jobs only"}
  - {schema: jobs, path: "jobs[*].step", type: string, meaning: "the program step's name (generator, measurer, merge...); program_step jobs only"}
  - {schema: jobs, path: "jobs[*].item", type: string, meaning: "the item the job worked on"}
  - {schema: jobs, path: "jobs[*].started_at", type: string, meaning: "start time, RFC 3339"}
  - {schema: jobs, path: "jobs[*].exit_code", type: integer, meaning: "the job's exit code"}
  - {schema: jobs, path: "jobs[*].subtype", type: string, meaning: "Claude CLI result subtype of an agent job (success, error_max_turns, error_max_budget_usd, error_during_execution); null when the CLI wrote no result"}
  - {schema: jobs, path: "jobs[*].num_turns", type: integer, meaning: "Claude CLI result num_turns of an agent job; null when the CLI wrote no result"}
  - {schema: jobs, path: "jobs[*].tree_changed", type: boolean, meaning: "builder jobs only: true when the program committed a change after the round, false for a round that changed nothing"}
  - {schema: jobs, path: "jobs[*].ended_at", type: string, meaning: "end time, RFC 3339"}
  - {schema: jobs, path: "jobs[*].cost_usd", type: number, meaning: "Claude CLI total_cost_usd of the job; 0 for a program step"}
  - {schema: jobs, path: "jobs[*].tokens", type: integer, meaning: "Claude CLI usage input plus output tokens; the only stored token count, item and report totals are sums"}
  - {schema: jobs, path: "jobs[*].cached", type: boolean, meaning: "true when a cached job result was reused"}
  - {schema: jobs, path: "jobs[*].packet_sha256", type: string, meaning: "sha256 of the packet the job read"}
  - {schema: jobs, path: "jobs[*].objections[*]", type: string, meaning: "a judge objection, shown to the approver"}
  - {schema: jobs, path: "jobs[*].falsifying_calls[*]", type: string, meaning: "a judge call that would falsify the design; becomes a target"}
  - {schema: jobs, path: "jobs[*].round", type: integer, meaning: "the builder round the job ran in, 1 to max_rounds, counted per packet across runs; builder jobs only (the item's rounds are computed from it, never stored)"}
  # config
  - {schema: config, path: concurrency, type: integer, default: 5, meaning: "agents running at once"}
  - {schema: config, path: sizing.packet_tokens, type: integer, default: 1600, meaning: "cap on planner-written packet tokens, as bytes/4"}
  - {schema: config, path: limits.message_chars, type: integer, default: 300, meaning: "longest teaching message per finding"}
  - {schema: config, path: limits.findings_shown, type: integer, default: 10, meaning: "findings printed before the count of the rest"}
  - {schema: config, path: limits.h2_chars, type: integer, default: 200, meaning: "longest H2 hook line"}
  - {schema: config, path: limits.record_chars, type: integer, default: 6000, meaning: "longest decision record (two pages)"}
  - {schema: config, path: max_rounds, type: integer, default: 3, meaning: "builder rounds before the item is stuck"}
  - {schema: config, path: commands.timeout_s, type: number, default: 600, meaning: "seconds before a command is killed"}
  - {schema: config, path: limits.flaky_reruns, type: integer, default: 0, meaning: "reruns of a failing test"}
  - {schema: config, path: limits.idle_days, type: integer, default: 14, meaning: "days without a sub-issue event before the idle_tracking fact"}
  - {schema: config, path: limits.known_issues, type: integer, default: 100, meaning: "lines the Known issues list may hold"}
  - {schema: config, path: limits.measure_overhead_s, type: number, default: 2, meaning: "measurer overhead on the toy, without the test command"}
  - {schema: config, path: "limits.socket_groups[*]", type: string, default: [docker], meaning: "groups whose members refuse a builder launch"}
  - {schema: config, path: sandbox, type: object, meaning: "the Claude Code sandbox settings object, passed verbatim into the builder's settings"}
  - {schema: config, path: sandbox.network.allowAllUnixSockets, type: boolean, default: false, meaning: "the host's key; set only when the sandbox probe passes with it and fails without it"}
  - {schema: config, path: evals.runs, type: integer, default: 3, meaning: "runs per eval arm"}
  - {schema: config, path: "models.*", type: string, default: "the plugin's preset per role", meaning: "the model per job role (planner, judge, test_author, builder, reviewer...)"}
  - {schema: config, path: "tiers.triggers[*].paths", type: "array of string", default: "the plugin's trigger list", meaning: "path patterns that make an item design-affecting"}
  - {schema: config, path: "tiers.triggers[*].tier", type: string, default: "the plugin's trigger list", meaning: "the tier a trigger sets"}
  - {schema: config, path: "tiers.triggers[*].fresh_stack", type: boolean, default: "the plugin's trigger list", meaning: "the trigger needs a fresh-stack run"}
  - {schema: config, path: "review.triggers[*]", type: string, default: "inferred from standard files", meaning: "path patterns whose change launches a reviewer job"}
  - {schema: config, path: "protected[*]", type: string, default: "the tests, test and lint config sections, recipe and ratchet files", meaning: "paths the measurer lays over the build from the plan commit"}
  - {schema: config, path: budgets.job_usd, type: number, default: 20, meaning: "spend cap per job launch (--max-budget-usd)"}
  - {schema: config, path: budgets.run_usd, type: number, default: "budgets.job_usd x concurrency, computed when absent (100 by default)", meaning: "spend cap per run"}
  - {schema: config, path: "paved_road.test_paths[*]", type: string, default: "inferred from pytest testpaths or the JS test runner config", meaning: "where the builder puts its own tests; copied to the packet"}
  - {schema: config, path: paved_road.dependency_command, type: string, default: "inferred from the lockfile", meaning: "how a builder adds a dependency; copied to the packet"}
  - {schema: config, path: "right_way.*", type: string, default: "the plugin's preset text per enabled rule code", meaning: "the right-way line for a fixed-message linter rule, keyed by rule code"}
