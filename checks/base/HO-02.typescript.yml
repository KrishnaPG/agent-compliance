# HO-02 (a hand-off is published only after the source committed), TypeScript.
# Written for ast-grep 0.51.3. The harness runs this rule on every module except
# the project's `outbox_modules` bind; a match there is the outbox relay itself.
id: HO-02.typescript
language: typescript
severity: error
message: Direct broker publish outside the outbox (catalog HO-02). Write the event to the outbox in the same transaction as the change; only the outbox relay publishes.
note: Flags publish on a NATS or JetStream client, produce on a Kafka producer, and send or sendBatch on a producer.
metadata:
  catalog: [HO-02]
  pack: base
rule:
  kind: call_expression
  any:
    - pattern: $CLIENT.publish($$$)
    - pattern: $CLIENT.produce($$$)
    - pattern: $CLIENT.send($$$)
    - pattern: $CLIENT.sendBatch($$$)
constraints:
  CLIENT:
    regex: '(?i)((^|\.)(nc|js|nats|jetstream|natsClient|jsClient)$|producer$|publisher$|broker$|jet_?stream$)'
