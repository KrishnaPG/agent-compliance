    import time
    time.sleep(0.1)
  # a loop that blocks on the producer's event, not on a timer
  - |
    async def consume(sub):
        async for msg in sub.messages:
            await handle(msg)
            await msg.ack()
  # a sleep inside a function defined in a loop body belongs to that function
