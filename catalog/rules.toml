applies = ["database"]
cites = []

[house.DS-01]
text = "No data-bearing object (volume, database, bucket, stream, storage pool, generated-once secret, host data directory) is deleted by a person, agent, job, prune or configuration state unless (a) a completed native backup newer than its last write exists, within its tier's RPO (DS-12), whose restore passed, or (b) a recorded project-owner decision says it is not retained."
