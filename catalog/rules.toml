# The rules a design, plan, packet or review cites: every rule of the v1 base catalog (catalog
# 1.5.2, its ids kept), each explained in the repo. A house rule has `text` (the rule), `why`
# (in our own words), `right` (the right way: the packet's one line), `question` (the check),
# `severity` (its default triage class: S1 critical, S2 major or S3 minor, from what the rule
# protects by QBC-114's mapping), `applies` (fact tags below, which select it for an item),
# `cites` ("<standard key>:<section>", provenance only; the [standards.*] summary says what the source teaches) and, where the harness
# does it by mechanism, `embodied_by`. A rule id is a house rule id or "<standard key>:<section>".
# A project adds rules or opts out (with a reason) in its own overlay; checks/index.json binds a
# house rule to the linter check that finds its breaches. `bh rule ID` prints one rule in full.

# The closed set of fact tags a house rule's `applies` names (bhrules.select_rules). The program
# derives each tag with no agent: `names` are import roots and declared or locked package names,
# `files` are path globs of file kinds, `facts` are code facts the checks also bind, `kinds` are
# item kinds, `interfaces` are the kinds of the item's declared interfaces (bricks.schema.json),
# `commits` are the Conventional Commits types of a change's commits.
# Detection follows how linters choose rule sets (language, framework, file globs) and how
# dependency tools read manifests and lock files.

[tags.always]
means = "every code item"

[tags.network-client]
means = "calls another process or provider over the network (HTTP or gRPC client, cloud API, remote shell)"
interfaces = ["calls"]
names = ["requests", "httpx", "aiohttp", "urllib3", "urllib", "grpc", "grpcio", "boto3", "botocore", "paramiko", "fabric", "asyncssh", "axios", "node-fetch", "got", "undici", "ky", "@grpc/grpc-js"]

[tags.http-server]
means = "receives requests: routes, an app or a webhook endpoint (a trust boundary)"
interfaces = ["serves"]
names = ["fastapi", "starlette", "flask", "django", "sanic", "litestar", "falcon", "express", "fastify", "koa", "hono", "@nestjs/core"]
facts = ["entry_modules"]

[tags.messaging]
means = "publishes or consumes on a message channel or an outbox, or hands work to another owner"
interfaces = ["publishes", "consumes"]
names = ["nats", "nats-py", "kafka", "kafka-python", "confluent-kafka", "aiokafka", "pika", "aio-pika", "kombu", "celery", "paho", "paho-mqtt", "faststream", "dramatiq", "rq", "google-cloud-pubsub", "azure-servicebus", "kafkajs", "amqplib", "bullmq", "mqtt"]
facts = ["outbox_modules"]

[tags.database]
means = "owns or writes persistent data (database, SQL, migrations, object store)"
interfaces = ["stores"]
names = ["sqlalchemy", "sqlmodel", "alembic", "psycopg", "psycopg2", "asyncpg", "sqlite3", "duckdb", "pymongo", "motor", "redis", "peewee", "pg", "knex", "prisma", "@prisma/client", "drizzle-orm", "typeorm", "sequelize", "mongoose", "mysql2", "better-sqlite3", "ioredis"]
files = ["*.sql", "migrations/*", "*/migrations/*"]

[tags.auth]
means = "handles credentials, secrets, tokens, keys, signatures, identities or authorization"
names = ["jwt", "pyjwt", "jose", "python-jose", "authlib", "oauthlib", "passlib", "bcrypt", "argon2", "argon2-cffi", "cryptography", "nacl", "pynacl", "itsdangerous", "hmac", "secrets", "keyring", "hvac", "jsonwebtoken", "bcryptjs", "passport"]

[tags.money]
means = "amounts, prices or currency"
names = ["decimal", "py-moneyed", "moneyed", "dinero.js", "currency.js"]

[tags.time]
means = "timestamps, clocks, timings, time zones, schedules or expiry dates"
names = ["time", "timeit", "pyperf", "pytest-benchmark", "perf_hooks", "datetime", "zoneinfo", "pytz", "dateutil", "python-dateutil", "pendulum", "arrow", "luxon", "dayjs", "date-fns", "moment"]

[tags.deploy]
means = "builds, releases or runs on infrastructure (container, compose, IaC, Kubernetes, systemd, CI pipeline)"
names = ["pulumi"]
files = ["Dockerfile", "*.dockerfile", "Containerfile", "docker-compose*.yml", "docker-compose*.yaml", "compose.yml", "compose.yaml", "*.tf", "*.tofu", "Chart.yaml", "kustomization.yaml", "*.service", "*.timer", "*.sls", ".github/workflows/*", ".gitlab-ci.yml", "Jenkinsfile", "Procfile"]

[tags.concurrency]
means = "threads, processes, async tasks, workers, locks, parallel steps or shared resources"
names = ["threading", "multiprocessing", "concurrent", "asyncio", "anyio", "trio", "gevent", "worker_threads", "p-limit", "p-queue"]

[tags.config]
means = "reads configuration, environment or settings"
names = ["dotenv", "python-dotenv", "pydantic-settings", "environs", "dynaconf", "configparser", "decouple", "python-decouple", "convict"]
files = [".env.example", "*.env"]

[tags.dependency-change]
means = "adds, removes or bumps a third-party dependency or adopts an OSS tool"
files = ["pyproject.toml", "requirements*.txt", "uv.lock", "poetry.lock", "Pipfile", "Pipfile.lock", "package.json", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "go.mod", "go.sum", "Cargo.toml", "Cargo.lock", "Gemfile", "Gemfile.lock"]

[tags.defect]
means = "fixes a defect"
kinds = ["defect"]
commits = ["fix"]  # Conventional Commits 1.0.0 types of a change's commits

