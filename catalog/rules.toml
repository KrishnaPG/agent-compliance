[house.PR-13]
text = "An agent session never runs a command that discards uncommitted or unpushed work (stash, hard reset, path checkout, clean, forced push); work is committed to a branch or backed up first."
why = "Such commands destroy work that exists nowhere else."
right = "Never run an agent command that discards uncommitted or unpushed work (stash, hard reset, path checkout, clean, force push); commit or back up first."
