[house.DS-04]
text = "Deletion walks the reverse reference graph. A record is eligible only when its semantic owner permits it, no retained descendant or active share needs it, no legal hold exists, retention expired, the backup policy permits disposition, and the exact generation and fingerprint reread still match. It leaves an immutable tombstone or receipt, never deletes the lineage node, and never lets old evidence claim the bytes still exist."
