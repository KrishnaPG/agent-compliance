[house.HO-27]
text = "A business refusal ends its execution as failed and publishes a typed refusal outcome with reason and business keys; a log line or counter is no outcome. A message is skipped (and counted) only when it is not addressed to the consumer, never when a precondition of the requested effect is missing."
