applies = ["dependency-change"]
cites = []

[house.PN-11]
text = "Code a plan gives verbatim has passed the project's commit check in a scratch tree before the plan is approved; the plan's own text is not evidence that it parses or runs."
why = "Plan text that was never run may not parse or work."
right = "Run code given verbatim in a plan through the project's commit check in a scratch tree before approving the plan."
question = "Was each verbatim block run through the check?"
severity = "S3"
applies = []
cites = []
embodied_by = "harness-reviewer job (fresh reader of a sellable diff)"

[house.PN-12]
text = "The plan names its reliability profile, classifies stored sources (authority, projection or ephemeral) before design, and gives budgets for affected hot stages."
why = "Misclassified data gets the wrong durability, and unbudgeted hot paths become slow."
right = "Name the plan's reliability profile, classify each stored source as authority, projection or ephemeral first, and give budgets for hot stages."
question = "Are the profile, the classification and the budgets stated?"
severity = "S3"
applies = []
cites = []
embodied_by = "harness-planner job (plan from the build order)"

[house.PN-13]
text = "Tasks are small and vertical, each with one owner, files, inputs and outputs, prohibited writes, dependencies and a real-flow gate, with scoped cutover, rollback, cleanup and removal of replaced wiring."
why = "Large or ownerless tasks cannot be verified, reversed or cleanly removed."
right = "Split work into small vertical tasks, each with one owner, files, inputs, outputs, prohibited writes, a real-flow gate, rollback and cleanup."
question = "Does each task name its prohibited writes and its gate?"
severity = "S3"
applies = []
cites = []
embodied_by = "harness-planner job (plan from the build order)"

[house.PN-14]
text = "Acceptance is through real staged services, deterministic native seeds and public entry points. No mock, fake store or test-only path is feature proof. Source checks, native-runtime evidence and public-journey evidence are reported separately."
why = "Mocks and test-only paths can pass while the real feature fails."
right = "Prove acceptance through real staged services, deterministic seeds and public entry points, reporting source, runtime and journey evidence separately."
question = "What proves each task, and is any proof a mock or a source check?"
severity = "S3"
applies = ["deploy"]
cites = []

[house.PN-15]
text = "A step's verification is the real call and the owner's response or read-back; a step that changes an install path includes its empty-machine run."
why = "Unverified steps hide breakage until a fresh install."
right = "Verify each step by the real call and the owner's response or read-back; include an empty-machine run for steps changing an install path."
question = "Which step is verified only by its own exit code or text?"
severity = "S3"
applies = ["deploy"]
cites = []

[house.PN-16]
text = "A step that cannot pass stops the work and reports the gap; it is never worked around and never passed by weakening a check or test (PR-08)."
why = "Bypassing a failure hides a real defect and lowers the bar."
right = "When a step cannot pass, stop and report the gap; never work around it or weaken a check."
question = "What does each step say to do when it fails, and does any branch weaken a check?"
severity = "S2"
applies = ["defect"]
cites = []

[house.PN-17]
text = "Irreversible steps come after every step that can refuse, and each cutover has its rollback."
why = "An irreversible step done early leaves no way back when a later check fails."
right = "Order steps so irreversible ones come after every step that can refuse, and give each cutover a rollback."
question = "Which step cannot be undone, and what precedes it?"
severity = "S2"
applies = ["deploy"]
cites = []

[house.PN-18]
text = "The plan records a bounded second-pass audit with concrete corrections or open gaps (architecture alignment, requirement coverage, native reuse, root cause, proportionate durability, dead paths, resource lifetime, copies, test realism)."
why = "One pass misses classes of defects an explicit checklist catches."
right = "Record a bounded second-pass audit with concrete corrections or open gaps across alignment, coverage, reuse, root cause, durability and test realism."
question = "Is the audit present with findings, not ticks?"
severity = "S3"
applies = []
cites = []
embodied_by = "harness-reviewer job (fresh reader of a sellable diff)"

[house.PN-19]
text = "A target with no surface (zero-copy where no data path exists) is marked not applicable, never padded."
why = "Padding adds fake work and noise that hides real gaps."
right = "Mark a target with no surface as not applicable; never pad it."
question = "Is any target claimed that the work cannot affect?"
severity = "S3"
applies = []
cites = []
embodied_by = "harness-reviewer job (fresh reader of a sellable diff)"

[house.PR-01]
text = "A defect of any size gets a record with its root cause and a test that reproduces or guards it; its fix references the record. The record closes only when that test passes on the fixed product, and a later failure reopens it."
why = "Defects without records and guarding tests come back unnoticed."
right = "Record every defect with its root cause and a reproducing test, reference the record in the fix, and close it only when the test passes."
question = "What does the artifact say to do when a defect is found during the work, and when does its record close?"
severity = "S3"
applies = ["defect"]
cites = ["SRE:ch15 Postmortem Culture: Learning from Failure"]
embodied_by = "bug-analysis skill (defect record)"

[house.PR-02]
text = "No rule requires a test. One is written only for what no dashboard, log, platform status, check, release gate or release smoke would show: racy or edge-case decision logic, absence invariants, money and entitlement arithmetic, transformation programs on fixtures, cross-service schemas, the order of irreversible steps. Never a test that searches source text or repeats an outcome a release shows."
why = "Redundant tests add upkeep and false confidence without catching new failures."
right = "Write a test only for what no dashboard, check or release smoke shows (edge logic, money arithmetic, step order); never test source text."
question = "What does each proposed test catch that nothing else shows?"
severity = "S3"
applies = ["defect"]
cites = []

[house.PR-03]
text = "Pushed history is never rewritten and the main branch is never force-pushed; a commit refused after it was pushed is corrected by a later commit that names it."
why = "Rewritten history breaks everyone else's copies and the audit trail."
right = "Never rewrite pushed history or force-push main; correct a pushed commit with a later commit naming it."
question = "Does any step rewrite or force-push history?"
severity = "S3"
applies = ["deploy"]
cites = []

[house.PR-04]
text = "The review is by a reviewer who did not write the artifact and shares no context with its author, given the artifact without the author's reasoning; it names a location and a fix for each finding."
why = "Authors and their reasoning blind reviewers to the same mistakes."
right = "Have a reviewer who did not write the artifact and shares no context review it without the author's reasoning, naming location and fix per finding."
question = "Who reviews, and what is the reviewer given?"
severity = "S3"
applies = []
