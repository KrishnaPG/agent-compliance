[house.HO-36]
text = "Each guarantee an edge adds names its conformance test: duplicate (same id twice gives one effect), target down (effect lands after restore, no loss), crash after effect before acknowledgement (no second effect), poison (quarantined on first attempt, others unaffected), ordering (final state equals the newer version), ambiguous outcome (query before retry, one effect), reconciliation (a deleted row is detected and repaired), replay (state unchanged). An integration counts as qualified only after those tests pass."
