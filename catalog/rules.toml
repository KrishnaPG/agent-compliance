text = "The owner's client handles documented status and retry; the caller adds only the one retry owner, the deadline, ambiguous-outcome resolution and quarantine. A refusal counts as success only as the owner's duplicate signal on a caller-chosen key, confirmed by reread; any other failure reports status, error type and bounded detail, never the raw body."
