[house.PR-14]
text = "Questions that unattended runs, agent jobs included, raise for the project owner (only those PR-10 makes the owner's) are collected into one list per run and put to the owner once, at the end of the run or when no work can continue around them; no step waits for an answer (RL-16). Each answer is recorded with its question where the project records decisions, every run looks the record up before it asks, and a question whose recorded answer still holds (its cited inputs unchanged) is never asked again. NA where no unattended run can raise a question for the project owner."
