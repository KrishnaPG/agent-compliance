applies = []
cites = []
embodied_by = "harness-planner job (plan from the build order)"

[house.PN-02]
text = "No step leaves a decision to the implementer: no \"decide\", \"choose\", \"as appropriate\" or \"e.g.\" in an instruction. A junior engineer can follow it to a successful result without thinking or deciding."
why = "Left-open choices get made differently by each implementer."
right = "Write every instruction so a junior engineer can follow it without deciding; no 'decide', 'choose', 'as appropriate' or 'e.g.'."
question = "Which steps need judgement?"
severity = "S3"
applies = []
cites = []
embodied_by = "harness-planner job (plan from the build order)"

[house.PN-03]
text = "An unproven claim is a gate step with both outcomes written in advance."
why = "Plans built on unchecked claims break midway with no branch to follow."
right = "Turn each unproven claim into a gate step with both outcomes written in advance."
question = "Which claims has nothing run yet, and what does the plan say for each result?"
