embodied_by = "catalog/rules.toml and the overlay"

[house.DC-11]
text = "A missing capability or decision is a named blocked gate; never assumed support, a fabricated placeholder or aspirational prose."
why = "Assumed capabilities make plans that fail when reality is checked."
right = "Name a missing capability or decision as a blocked gate; never assume support or write placeholders or aspirational prose."
question = "What does the artifact assume exists that nothing has proved?"
severity = "S3"
applies = []
cites = []
embodied_by = "harness-gaps-reader and harness-planner jobs (what cannot be derived is a gap, never assumed)"

[house.DC-12]
text = "A generic claim (\"improve reliability\", \"make it observable\") is invalid without its named owner, template, contract, file or flow stage."
why = "A claim with no owner is nobody's job and cannot be checked."
right = "Attach to every generic claim its named owner, template, contract, file or flow stage."
question = "Which claim names no owner or file?"
severity = "S3"
applies = []
cites = []
embodied_by = "catalog/rules.toml and the overlay"

[house.PN-01]
text = "Each step states: File (path with a symbol, state id or grep anchor, never a line number), Do (the exact edit or command), Expect (the owner's read-back), Verify, and If it fails."
why = "Steps missing any of these force guessing and fail when lines shift."
right = "Write each step with File (path plus symbol or anchor, no line numbers), Do, Expect, Verify and If it fails."
