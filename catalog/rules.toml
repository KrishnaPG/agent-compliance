applies = []
cites = []
embodied_by = "harness-planner job (recorded decisions and approved documents are settled inputs)"

[house.DC-10]
text = "A rule has one home; other documents link the existing contract instead of copying it. (This catalog's rows are the review's working text; the source stays the rule's home.)"
why = "Copies diverge, leaving contradictory versions of one rule."
right = "Give each rule one home and link to it from other documents instead of copying it."
question = "Is any rule or contract restated in the artifact that lives elsewhere?"
