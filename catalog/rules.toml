text = "Only a fresh install and a restore from backup are supported recoveries; data lost with no restore is a fresh install. A restore re-drives the reconciliations of what it restored, by the restore's own event or, where the owner emits none, by an audited operator re-drive. No sweep or catch-up job exists for a lost-data incident."
