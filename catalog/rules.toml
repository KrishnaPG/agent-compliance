applies = []
cites = []
embodied_by = "tracker intake (GitHub issues)"

[house.PR-10]
text = "Only decisions that are the project owner's to make are escalated (a conflict between approved documents, a new owner, a wider privilege, retention, scope), each named as such. Anything else is decided by the standard and recorded. An escalation never stops the work."
why = "Over-escalation stalls work, and unescalated owner decisions are made by the wrong person."
right = "Escalate only decisions that are the project owner's, named as such; decide everything else by standard and record it; never stop work to escalate."
question = "Is each open question the project owner's to decide, and does work continue around it?"
severity = "S3"
applies = []
cites = []
embodied_by = "tracker intake (GitHub issues)"

[house.PR-11]
text = "A place that two fixes have already rewritten since its last verified release is redesigned at its cause, never patched a third time."
why = "Repeated patches show the cause is unaddressed and keep failing."
right = "Redesign at the cause a place that two fixes already rewrote since its last verified release; never patch it a third time."
question = "Does the work patch a place already fixed twice?"
severity = "S2"
applies = ["defect"]
cites = ["SRE:ch15 Postmortem Culture: Learning from Failure"]
embodied_by = "bug-analysis skill (defect record)"

[house.PR-12]
text = "An end-to-end test derives from one acceptance criterion of a journey, names it and asserts only that criterion's outcome; a test with no criterion is deleted or its criterion is added to the journey."
why = "Tests without a criterion cover nothing agreed and rot."
right = "Derive each end-to-end test from one named acceptance criterion and assert only its outcome; delete tests with no criterion or add the criterion."
