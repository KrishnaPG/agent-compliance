embodied_by = "harness-reviewer job (fresh reader of a sellable diff)"

[house.PR-05]
text = "The owner's validator (server dry-run, chart template with merged values, rule checker, template render) runs on changed files before commit and is named in the commit."
why = "Invalid files caught only after commit break the pipeline for everyone."
right = "Run the owner's validator on changed files before commit and name it in the commit."
question = "Which validator covers each changed file?"
severity = "S3"
applies = ["deploy"]
cites = []

[house.PR-06]
text = "People's and agents' own waits follow RL-08: no sleep or poll loop in a shell; a wait is on the producer's event or a background task's completion."
why = "Polling wastes time, hides races and drifts from real readiness."
right = "Wait on the producer's event or a background task's completion; never use sleep or poll loops in a shell."
question = "Does any instruction tell a person or agent to sleep or poll?"
severity = "S2"
applies = ["deploy"]
cites = []

[house.PR-07]
text = "The standards win over a brief or an older artifact. A gate's refusal means the change broke a rule and is answered by a design step back, never a bypass."
why = "Bypassing a gate defeats the rule it enforces."
right = "Follow the standards over any brief or older artifact; answer a gate refusal by stepping back to design, never by bypassing it."
question = "What does the process do when a gate refuses?"
severity = "S2"
applies = ["defect"]
cites = []

[house.PR-08]
text = "No existing acceptance test is changed, loosened, skipped, re-timed or re-seeded to make it pass; a failing acceptance test is a product defect. Exception: the native owner's source proves no correct product can pass it as written, or a later approved decision settles which of two contradicting tests is stale; then only that defect is corrected, every assertion stays as strict, and the proof is recorded on the defect."
why = "Weakening tests hides real defects."
right = "Never change, loosen, skip, re-time or re-seed an acceptance test to pass; treat its failure as a product defect, with a recorded-proof exception."
question = "Does the work edit an existing acceptance test, and under which exception?"
severity = "S2"
applies = ["always"]
cites = []
