[house.HO-01]
text = "Every hand-off between owners MUST travel on one durable, persisted messaging channel with declared retention. Never as a hand-off: a direct call or a webhook consumed directly, an in-memory queue, a table two owners write, a file drop, email, or a job comparing two systems. A synchronous interaction is allowed only as HS-03 (interactive command to the owner), HS-04 (read) or HS-12 (data-plane transfer) state it; a deviation is recorded under HO-37."
why = "Side channels lose work silently when a party is down and leave no record of what was sent. One durable channel makes every obligation survive outages and be inspected."
right = "Send every hand-off between owners over one durable messaging channel with declared retention; never a direct call, shared table or file drop."
question = "By which channel does each fact, command or obligation leave its owner?"
severity = "S2"
applies = ["messaging"]
cites = ["EIP:MessageChannel", "EIP:GuaranteedMessaging"]

[house.HO-02]
text = "A hand-off is published only after its source committed (change-data capture, the owner's change stream, an outbox, or a step that publishes its own committed outcome and acknowledges its input only after that publish is confirmed); no step writes two owners, or an owner and the channel, at once."
why = "Writing a store and the channel separately lets one succeed and the other fail, so facts get announced that never happened or happen unannounced."
right = "Publish a hand-off only after the source committed, via change capture or an outbox; never write two owners, or an owner and the channel, in one step."
question = "Is there a dual write, or a publish before commit?"
severity = "S2"
applies = ["messaging"]
cites = ["Microservices-io:TransactionalOutbox", "EIP:TransactionalClient"]

[house.HO-03]
text = "Every message carries: an id deterministic from the source (never random at retry), a versioned type, the aggregate key, the owner's commit time, correlation and causation ids, and trace context."
why = "Random ids at retry defeat deduplication, and without correlation and trace data nobody can follow one business fact across owners."
right = "Give every message a source-derived stable id, versioned type, aggregate key, owner commit time, correlation and causation ids, and trace context."
question = "How is each message id derived, and is it stable across a retry?"
severity = "S2"
applies = ["messaging"]
cites = ["CloudEvents:Context Attributes", "CloudEvents:Distributed Tracing Extension", "EIP:CorrelationIdentifier", "EIP:FormatIndicator"]

[house.HO-04]
text = "A message carries identifiers and small facts within a stated size bound. Bytes (files, exports, models) stay in their store and travel as reference, size and checksum."
why = "Large payloads clog the channel and slow every consumer, and copies of bytes scatter data away from the store that owns it."
right = "Keep messages to identifiers and small facts within a stated size bound; send bulk bytes as a reference with size and checksum."
question = "Does any payload carry bulk bytes or exceed the stated bound?"
severity = "S2"
applies = ["messaging"]
cites = ["EIP:StoreInLibrary"]

[house.HO-05]
text = "Each producer and consumer has its own broker identity limited to its channels, over an encrypted link. A tenant id in an address is routing, never authorization."
why = "Shared or broad identities let one compromised party read or write everything, and address text is trivially forged."
right = "Give each producer and consumer its own scoped broker identity over an encrypted link; never treat a tenant id in an address as authorization."
question = "Does each party have its own scoped identity, and is anything authorized by address text?"
severity = "S2"
applies = ["messaging", "auth"]
cites = ["NIST-SP-800-53:AC-6", "NIST-SP-800-53:SC-8"]

[house.HO-06]
text = "Input is acknowledged only after the receiving owner durably received the obligation: the broker confirmed the publish, the owner's transaction committed, or the orchestrator persisted the execution. Before that, a retryable failure leaves the input unacknowledged; after it, the receiver owns execution, retry, outcome and repair. An in-progress signal never leases downstream completion."
why = "Acknowledging early loses work if the receiver crashes before persisting it, and nobody knows it was lost."
right = "Acknowledge input only after the receiving owner durably holds the obligation; before that, leave it unacknowledged on a retryable failure."
question = "At which exact boundary is each input acknowledged?"
severity = "S2"
applies = ["messaging"]
cites = ["EIP:GuaranteedMessaging", "EIP:TransactionalClient"]

[house.HO-07]
text = "Each edge has exactly one retry owner with bounded attempts. Nested retries are prohibited (a proxy and a client both retrying; an orchestrator retrying a task whose client retries). No retry, back-off or restart setting is added to outlast a race or ordering gap; the order is fixed on the dependency's readiness. The retry bound outlasts the dependency's stated longest tolerated outage, so a transient outage is not dead-lettered."
why = "Stacked retries multiply load during an outage and turn a blip into a cascade, and retries used to dodge ordering bugs hide the real defect."
right = "Give each edge one retry owner with bounded attempts outlasting the dependency's longest outage; no nested retries or retries to pass ordering gaps."
question = "Who retries each edge, is a second retry layered on it, and does any retry exist to get past an ordering gap?"
severity = "S2"
applies = ["network-client", "messaging"]
cites = ["SRE:ch22 Addressing Cascading Failures"]

[house.HO-08]
text = "After the retry bound, or on a non-retryable failure, a reference (never the payload) with the original channel, position, reason and correlation id goes to a dead-letter channel and an alert fires. Release is an explicit, audited operator action. Silent drops and unbounded retries are prohibited."
why = "Without a dead-letter path poison items either block everything or vanish, and nobody is told that work was not done."
right = "After the retry bound or a non-retryable failure, send a reference to a dead-letter channel and alert; release only by an audited operator action."
question = "Where does an undeliverable item go, who is alerted, and how is it released?"
severity = "S2"
applies = ["messaging"]
cites = ["EIP:DeadLetterChannel", "EIP:InvalidMessageChannel"]

[house.HO-09]
text = "Order is per aggregate key. Where order matters, consumption is serialized per aggregate partition and names the write it protects. Global serialization is prohibited; consumers tolerate out-of-order delivery across aggregates and reject a stale version by the owner's revision."
why = "Global ordering throttles the whole system, while ignoring order lets an older update overwrite a newer one."
right = "Order messages per aggregate key only, serialize consumption per partition where order matters, and reject stale versions by the owner's revision."
question = "Where order matters, what scopes it, and is anything serialized globally?"
severity = "S2"
applies = ["messaging"]
cites = ["EIP:Resequencer"]

[house.HO-10]
text = "Work that changes more than one owner is an orchestrated process with persisted state: one step per owner, a timeout per step, a compensation for each recorded effect, and a terminal state of succeeded, compensated or failed (needs an operator). Choreography by events is allowed only for independent notification or projection consumers."
why = "Ad hoc multi-owner changes leave half-applied states nobody can detect or undo."
right = "Run any change spanning several owners as an orchestrated, persisted process with a step per owner, timeouts, compensations and a terminal state."
question = "Does any multi-owner change run outside an orchestrated process with compensations and a terminal state?"
severity = "S2"
applies = ["messaging"]
cites = ["EIP:ProcessManager", "Sagas-1987:Sagas"]

[house.HO-11]
text = "Each integration declares a reconciliation of owner keys and totals against the target: read-only, bounded, started by an owner event, never by a schedule of ours. A difference alerts and triggers a replay or corrective flow. A read that fails, returns null or is truncated fails the run and never reports zero differences; a failed child counts as a difference. It never replaces the hand-off."
why = "Hand-offs can still drop or diverge; a reconciliation that passes on a failed read gives false assurance that everything matches."
right = "Reconcile owner keys and totals against each target, read-only, started by an owner event; a failed or truncated read fails the run."
question = "What starts each reconciliation, and what does it report when its read fails or is cut?"
severity = "S2"
applies = ["messaging"]
cites = ["SRE:ch26 Data Integrity: What You Read Is What You Wrote"]

[house.HO-12]
text = "Calls to an external provider pass through one throttle per provider account, set below the provider's published limit; a rate-limit answer's retry delay is honoured within the deadline."
why = "Exceeding provider limits gets the account blocked and makes retry storms worse."
right = "Send all calls to an external provider through one throttle per account set below its published limit, and honour its retry-delay answers."
question = "What limits the call rate to each provider, and how is a rate-limit or quota answer handled?"
severity = "S2"
applies = ["network-client"]
cites = ["SRE:ch21 Handling Overload", "RFC-6585:4 429 Too Many Requests"]

[house.HO-13]
text = "A message notifies of a committed fact or requests an effect; it is never the fact. A consumer that needs current state rereads the exact committed revision from the owner."
why = "Messages go stale or arrive out of order, so acting on their content instead of the owner's truth produces wrong decisions."
right = "Treat a message as a notice of a committed fact or a request; when current state matters, reread the exact committed revision from the owner."
question = "Does any consumer act on message content where it needs current owner state?"
severity = "S2"
applies = ["messaging"]
cites = []

[house.HO-14]
text = "Each event type has a schema in the repository, checked against recorded sample events. A change inside a version is additive only and consumers ignore unknown fields. A breaking change is a new type version; the producer publishes both until every declared consumer moved, then retires the old one."
why = "Silent incompatible changes break consumers that were never told, and retiring a version too early strands them."
right = "Version event schemas in the repo: change additively only, and publish a breaking change as a new type version beside the old until consumers move."
question = "Does a change alter an existing type incompatibly, or retire a version a consumer still reads?"
severity = "S2"
applies = ["messaging"]
cites = ["EIP:FormatIndicator"]

[house.HO-15]
text = "A message never carries tokens, secrets, signed URLs or personal data beyond the minimum keys. Authority for an asynchronous effect is the recorded decision id plus the target owner's own authorization of the consumer's workload identity."
why = "Messages are stored, copied and replayed, so any secret inside them leaks widely and outlives its validity."
right = "Keep tokens, secrets, signed URLs and extra personal data out of messages; authorize async effects by decision id and the consumer's own identity."
question = "What is in each payload, and whose identity authorizes the effect?"
severity = "S1"
applies = ["messaging", "auth"]
cites = []

[house.HO-16]
text = "Delivery is at least once, so every effect MUST be idempotent on the event id or a business key derived from it, by (in order of preference) a target-native key (upsert, PUT, declarative apply, unique natural key), else a provider idempotency key sent with the call, else a persistent idempotency repository. Memory-only deduplication and a broker's duplicate window are not idempotency."
why = "Delivery is at least once, so duplicates are certain; without idempotency they double-charge, double-create or double-send."
right = "Make every effect idempotent on the event id or a derived key: target-native key first, then provider key, then a persistent repository."
question = "What makes a second delivery of each effect a no-op?"
severity = "S2"
applies = ["messaging"]
cites = ["EIP:IdempotentReceiver"]

[house.HO-17]
text = "When a remote call times out or its connection drops after sending (an apply carried over a remote shell included), the outcome is unknown: the caller MUST query the target with the idempotency key before any retry, or rely on a target-native or provider idempotency key. A non-idempotent mutation is never retried blind."
why = "A timed-out call may have succeeded, so a blind retry can apply the change twice."
right = "After a timeout or lost connection on a mutating call, query the target by idempotency key before retrying; never retry a non-idempotent change blind."
question = "After a timeout or lost connection on each mutating call, what is read before it is repeated?"
severity = "S2"
applies = ["network-client"]
cites = []

[house.HO-18]
text = "Each integration declares its handling per failure class: retryable (timeout, 429, 503, connection error) is retried; non-retryable (400, 404, validation, schema mismatch) is quarantined at once; authorization (401, 403) is quarantined at once and a security alert fires; conflict (409) is resolved by reread from the owner, then acknowledged or quarantined."
why = "Treating all errors alike either retries hopeless requests forever or discards recoverable work, and hides security failures."
right = "Declare per failure class: retry transient errors, quarantine invalid ones, quarantine and alert on auth failures, reread the owner on conflicts."
question = "For each remote call, what happens on 400/404, 401/403, 409, 429 and 5xx?"
severity = "S2"
applies = ["network-client"]
cites = ["EIP:DeadLetterChannel", "EIP:InvalidMessageChannel"]

[house.HO-19]
text = "Every remote call and every multi-step process has an absolute deadline. The remaining budget travels with the call; no layer resets or extends it; each timeout is shorter than the caller's remaining budget. On an asynchronous edge the deadline is checked at each delivery, so a deadline quarantine is at most one redelivery interval late."
why = "Calls without a shared deadline hang or outlive the caller's patience, pile up work and tie up resources."
right = "Give every remote call and multi-step process an absolute deadline whose remaining budget travels with the call; no layer extends it."
question = "Does every call have a timeout derived from the caller's remaining budget, and can anything extend it?"
severity = "S2"
applies = ["network-client", "messaging"]
cites = ["Release-It:Timeouts"]

[house.HO-20]
text = "Each target dependency has one circuit breaker and a bulkhead (a bounded pool or concurrency). While the breaker is open, consumers stop pulling instead of spending retries. Queue depth and consumer lag have alert thresholds."
why = "Without isolation a failing dependency absorbs every worker and retry, dragging down unrelated work."
right = "Give each target dependency one circuit breaker and one bounded concurrency pool; stop consuming while open, and alert on queue depth and lag."
question = "For each dependency, what stops calls when it fails, and what bounds concurrent use?"
severity = "S2"
applies = ["network-client", "concurrency"]
cites = ["Release-It:Circuit Breaker", "Release-It:Bulkheads"]

[house.HO-21]
text = "Business time is the owner's commit time, never the consumer's clock. Periodic work is keyed by its period (`2026-10`), so a rerun is idempotent. Nothing waits by a sleep loop or poll."
why = "Consumer clocks drift and reruns of periodic jobs double-apply; waiting by time is fragile and wasteful."
right = "Stamp facts with the owner's commit time, key periodic work by its period, and never wait by sleep loop or poll."
question = "Which clock stamps each fact, and what keys a periodic run?"
