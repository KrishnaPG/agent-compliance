[house.PR-09]
text = "Every confirmed review or audit finding is recorded on its tracker in the same turn it is found; none stays in prose."
why = "Findings left in prose get forgotten."
right = "Record each confirmed review or audit finding on its tracker the same turn; leave none in prose."
