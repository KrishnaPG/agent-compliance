[house.DS-07]
text = "A seed, migrate, clean or reset (a command or a scheduled job) is explicit, idempotent, scoped to one installation, and prints its target before mutation. A clean removes only generated, run-scoped state (temporary files, caches, old run records) and needs no confirmation; a durable reset names its target and needs explicit confirmation."
