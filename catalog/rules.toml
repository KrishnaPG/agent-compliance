text = "Each capsule declares its recovery tier. Each tier states a maximum RPO and RTO in the design, and the capsule's backup and restore meet them; the top tier uses continuous log archiving with point-in-time recovery, an encrypted offsite copy and a periodic restore drill at a stated interval; the lowest tier is a rebuild target with bounded cleanup. A profile may tighten a tier, never silently weaken it; a single-node profile states which tiers node loss exceeds."
