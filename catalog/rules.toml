applies = []
cites = []
embodied_by = "harness-gaps-reader job (conflicts between documents are reported as gaps for the owner)"

[house.DC-09]
text = "Agent instructions, notes, hand-off documents and older artifacts never override an approved specification. An explicit override by the project owner is honoured and its exact scope recorded."
why = "Unrecorded overrides cause behaviour that no approved text supports."
right = "Let no note, instruction or older artifact override an approved spec; honour an explicit project-owner override and record its scope."
