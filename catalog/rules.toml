severity = "S1"
applies = ["deploy"]
cites = []

[house.SC-20]
text = "A stuck or slow image pull alerts against a stated bound, and no runtime no-progress timeout is overridden."
why = "Hung pulls stall rollouts silently, and overridden timeouts hide the cause."
right = "Alert when an image pull is stuck or slow against a stated bound, and never override a runtime no-progress timeout."
question = "What alerts on a failed or slow pull, and is any pull unbounded?"
severity = "S3"
applies = ["deploy"]
cites = []

[house.PL-01]
text = "An operator or break-glass action is one native call that keeps no orchestration state and polls nothing; the platform's access control decides who may run it; a destructive reset of an installation needs the installation's name typed as confirmation."
why = "Multi-step manual procedures drift and fail halfway, and an unconfirmed reset can destroy the wrong installation."
right = "Make an operator action one native call, no state or polling, platform-authorized; type the installation name to confirm a destructive reset."
question = "Is each manual action one call, what authorizes it, and what does it confirm before destroying?"
severity = "S2"
applies = ["deploy"]
cites = []

[house.PL-02]
text = "Desired state is declared, not scripted; stored versioned and immutable with its history; pulled by the platform's own agent, not pushed by hand; and continuously reconciled by that agent. The declared state holds only L1-L4 resources; run-time operations (L5) and durable results (L6) are never in it."
why = "Scripted, hand-pushed or mutable state drifts from what is recorded and cannot be restored or audited."
right = "Declare desired state, store it versioned and immutable, have the platform's agent pull and reconcile it; keep run-time ops and results out of it."
question = "Is any desired state imperative, mutable in place, or pushed by hand?"
severity = "S2"
applies = ["deploy"]
cites = ["OpenGitOps:Declarative", "OpenGitOps:Versioned and Immutable", "OpenGitOps:Pulled Automatically", "OpenGitOps:Continuously Reconciled"]

[house.PL-03]
text = "Build, release and run are separate stages: a release is an immutable pinned commit with its digests, and a running host changes no code or artifact. A release run pins the pushed head at its start, works from its own isolated checkout of that commit to the end, refuses uncommitted deploy changes, and nothing edited, committed or pushed during the run changes what it executes or how a check judges it."
why = "Editing a live system or a moving checkout makes what runs differ from what was reviewed."
right = "Separate build, release and run: release a pinned immutable commit, change nothing on a running host, run from an isolated checkout."
question = "Can the running system differ from its release without a new release? Can an edit, commit or push during a run change what that run executes?"
severity = "S2"
applies = ["deploy"]
cites = ["Twelve-Factor:V Build, release, run"]

[house.PL-04]
text = "A dependency is either required (a consumer's readiness waits on its health) or optional (no readiness, release or health check waits on it, and its absence degrades one named feature). Nothing a consumer needs to serve is declared optional."
why = "Mislabelled dependencies either block releases on unneeded services or let the system report healthy while broken."
right = "Mark each dependency required (readiness waits on it) or optional (nothing waits, one named feature degrades); nothing needed to serve is optional."
question = "Which dependencies are optional, and does anything wait on them?"
severity = "S2"
applies = ["deploy"]
cites = []

[house.DC-01]
text = "Every line of a document an agent or engineer reads (instructions, standards, decision records, specifications, plans) is correct and actionable for a reader who loads only that line, section or file."
why = "Agents and engineers load fragments, so a line that depends on elsewhere misleads."
right = "Make every line of a document correct and usable when read alone, without needing another section."
question = "Read each section alone: is anything wrong or unusable without another section?"
severity = "S3"
applies = []
cites = []
embodied_by = "catalog/rules.toml and the overlay"

[house.DC-02]
text = "A decision rewrites, in the same change, every line in every document that states the old rule."
why = "Stale copies of an old rule keep getting followed."
right = "In the same change, rewrite every line in every document that states a rule the decision changes."
question = "Which other documents state what this artifact changes, and are they in the change?"
severity = "S3"
applies = ["defect"]
cites = ["Pragmatic-Programmer:DRY"]

[house.DC-03]
text = "No document carries wording that marks a rule as superseded, withdrawn, replaced or amended by another (such as \"supersedes\", \"superseded by\", \"withdrawn\", \"amended by\"), a dated amendment beside the old text, a revision history, change markers, or an appendix mapping old rules or review items to new ones. Provenance goes in the commit message and the tracking issue."
why = "History inside documents makes readers unsure which text applies."
right = "Write only the current rule; keep supersession, revision history, change markers and old-to-new mappings out of documents, in commit and issue."
question = "Does the artifact describe its own history instead of the current rule?"
severity = "S3"
applies = ["defect"]
cites = []

[house.DC-04]
text = "A document that no longer governs anything is deleted. Evidence annexes (inventories, measurements) stay."
why = "Orphan documents mislead readers into obeying dead rules."
right = "Delete any document that governs nothing; keep evidence annexes."
question = "Does the change leave a document that governs nothing?"
severity = "S3"
applies = ["defect"]
cites = []

[house.DC-05]
text = "The design applies every relevant requirement of the project's glossary, context documents, decision records and approved specifications, failure cases included, through the owner's native file or call, and never asks the project owner to reselect an approved decision."
why = "Ignored approved requirements and re-asked decisions waste time and cause rework."
right = "Apply every relevant approved requirement, failure cases included, through the owner's native call; never ask the owner to reselect a decision."
question = "Which approved requirement in scope does the artifact not address?"
severity = "S3"
applies = []
cites = []
embodied_by = "bh plan packet (cited passages)"

[house.DC-06]
text = "The design records only a named cross-owner guarantee or an unavailable native boundary. It carries no clause matrix, no catalog of owner functions and no static coverage table; static traceability never qualifies a native capability, the real call does."
why = "Static tables go stale and prove nothing; the real call is the proof."
right = "Record only a named cross-owner guarantee or unavailable native boundary; no clause matrix, function catalog or coverage table as proof."
question = "Does the artifact carry a clause matrix, an owner-function catalog or a coverage table, or offer one as proof?"
severity = "S3"
applies = []
cites = []
embodied_by = "catalog/rules.toml and the overlay"

[house.DC-07]
text = "A design never rewrites the standards to fit itself. Where the standards cannot express the brief, the gap is stated separately, reviewed alone, and the design waits."
why = "A design that rewrites its own judge always passes."
right = "Never edit the standards a design is judged by; state the gap separately, have it reviewed alone, and wait."
question = "Does the change edit a standard it is judged by?"
severity = "S3"
applies = []
cites = []
embodied_by = "catalog/rules.toml and the overlay"

[house.DC-08]
text = "A conflict between approved documents, or between an industry standard and an approved decision, goes to the project owner with both clauses quoted; it is never designed around."
why = "Silent resolution picks a winner the owner never chose."
right = "Send a conflict between approved documents or standard and decision to the project owner with both clauses quoted; never design around it."
question = "Where two sources disagree, is the conflict named or silently resolved?"
