[house.HO-40]
text = "A wake-up signal that is not durable (a database notification such as PostgreSQL LISTEN/NOTIFY, an in-process event, an unpersisted push) is only a hint that the durable channel (HO-01) or the owner's own outbox table holds new work. It is never the hand-off and never the only record of the work. Its consumer subscribes to the hint first, then drains the durable backlog from its last acknowledged position (or every unclaimed item); it does this on start, on restart, after every reconnection and on each hint, and a hint that arrives during a drain causes one more drain. A signal lost while the consumer was down, disconnected or busy therefore loses no work. A non-durable hint is used only where it cannot be lost without the consumer observing a restart or a disconnection; otherwise the consumer is woken by the durable channel's own blocking read or delivery. The hint replaces polling (RL-08); a periodic re-scan is never added to cover a lost hint. NA where the design uses no non-durable wake-up signal."
why = "Lost hints would leave work unread until some later signal, and a polling fallback reintroduces the timers the design avoids."
right = "Treat a non-durable wake-up as a hint only: subscribe, then drain the durable backlog on start, reconnect and each hint; never add a periodic re-scan."
question = "For each wake-up signal: is it durable? If not, does the consumer subscribe before it drains, and what does it read on start, restart, reconnection and each hint? Can the signal be lost while the consumer stays connected and running? Name a signal whose loss leaves work unread until a later signal."
severity = "S2"
applies = ["messaging"]
cites = ["EIP:GuaranteedMessaging", "EIP:EventDrivenConsumer", "Kubernetes:API Concepts, Efficient detection of changes", "PostgreSQL:NOTIFY"]

