[house.LC-39]
text = "Every termination effect (delete, revoke, disable, prune, offboarding, credit or reversal, cleanup, reset, session, token, grant or membership end) MUST declare its termination tier (T0, T1 or T2), its bound (\"at the action\" for T0, a number for T1 and T2, and for T1 the spend cap), and the native mechanism that meets it. An effect that ends access declares them for each class of operation it must stop: T0 operations are refused at the action, T1 operations stop within the T1 bound, T2 operations within the T2 bound. A termination with no declared tier is BROKEN."
why = "Ending access or deleting without a declared bound leaves late or unguarded execution that costs money or destroys data."
right = "Declare for every termination effect its tier (T0, T1, T2), its bound (at the action, or a number plus spend cap) and the native mechanism meeting it."
question = "For each thing the design ends, removes or destroys: which termination tier, which number, which native mechanism?"
severity = "S3"
applies = ["auth"]
cites = []

[house.LC-40]
text = "A T0 effect (it destroys or exports data, or commits money, a credit or reversal included) is checked at the action: its authorization and its eligibility (DS-01, DS-04) are read from the owner's current state at the moment it acts, never from a cache, a token, a projection or an earlier step's read. It runs after every reversible step and after every check that can still refuse. A T0 effect that cannot be checked at the action is a named, measured gap, never reported as covered."
why = "Authorizing from a cache or earlier read lets destruction or money movement run on stale permission."
right = "Check a T0 effect at the moment of acting from the owner's current state, after all reversible steps; if impossible, record a measured gap."
question = "Which read guards each irreversible effect, how old can that read be when the effect runs, and can a later step still refuse after it?"
severity = "S2"
applies = ["database", "money"]
cites = []

[house.LC-41]
text = "A T1 or T2 bound is met by a native mechanism of the owner or enforcer, paid per change and not per request, preferred in this order: the owner's native expiry or an end armed in advance; a push on change; the enforcer's own next-request refusal; revoking the session; ending running work by the owner's own end of the object that owns it (one stop, shutdown, cancel or delete, whose cascade ends the children; one call for one named child). The design never lists an owner's children to end each, and never ends a parent whose cascade reaches retained data. Never a timer, poll or sweep of ours, and never a cache or token lifetime shortened without its measured per-request cost. Each bound is measured, and exceeding it alerts."
why = "Our own sweeps cost per request, drift and miss cases the owner's native end handles by construction."
right = "Meet T1 and T2 bounds with the owner's native expiry, push, refusal, revoke or one parent stop; never our own timer, poll or sweep."
question = "Which native mechanism ends each T1 and T2 operation, does any step enumerate an owner's children, what is its worst-case delay against the bound, and what measures and alerts on a late end?"
severity = "S2"
applies = ["auth"]
cites = []

[house.LC-42]
text = "Ending a membership, affiliation, seat, grant or tenant ends access only. It never deletes or disables the person's own account, their links to other identity providers, authorship or history, except on the person's own erasure request (DS-15), and it destroys no data beyond the organisation's stated data policy and retention (DS-01, DS-04, DS-16). An owner call that removes the person as a side effect of removing a membership or an organisation is a T0 effect: refused, or allowed only where the project's overlay names the case and it is guarded at the action. An account that exists only for one duty (a service or duty account) is removed under ID-05."
why = "A side-effect deletion destroys a person's identity and records when only their access should end."
right = "Ending a membership, seat or grant removes access only; never delete the person's account, links or history except on their own erasure request."
question = "When a member leaves or a tenant ends: what exactly is removed, does the person's account with its links and history survive, and which policy line permits each data deletion; is a removal of the person only their own erasure request (DS-15)?"
severity = "S1"
applies = ["auth"]
cites = []

[house.LC-43]
text = "Code at a life site (an acquisition with its parents or dependency edges) names its level, and code at a death site (a termination effect) names its termination tier with bound and mechanism and what it keeps, as a one-line comment of rule ids at the site (for example `LC-39 T1 60s via native expiry; LC-42 keeps person`); a format without comments carries it in the owner's description field or in the file that declares the object. A change that touches such a site adds or corrects the comment in the same change."
