embodied_by = "harness-planner job (plan from the build order)"

[house.PN-04]
text = "The plan never contradicts its spec; the spec is rewritten in place in the same pass."
why = "Contradicting documents leave the builder unable to know what is right."
right = "Rewrite the spec in place in the same pass whenever the plan changes it; never leave plan and spec in conflict."
question = "Where do plan and spec differ?"
severity = "S3"
applies = []
cites = []
embodied_by = "harness-planner job (plan from the build order)"

[house.PN-05]
text = "Per-setup values in commands come from the installation record and are checked against the machine (host name, current user, repository root); no literal host, user or path."
why = "Literals work on the author's machine only."
right = "Take per-setup values in plan commands from the installation record and check them against the machine; no literal host, user or path."
question = "Which command would fail or act on the wrong machine in another setup?"
severity = "S3"
applies = ["config"]
cites = ["Twelve-Factor:III Config"]

[house.PN-06]
text = "The plan records a dry run of its first steps by a reader with no context, and lists each guess that reader had to make; every guess is a plan defect to fix."
why = "Authors cannot see their own unstated assumptions."
right = "Record a dry run of the first steps by a reader with no context and fix every guess that reader made."
question = "Is the dry run recorded, and are its guesses fixed?"
severity = "S3"
applies = []
cites = []
embodied_by = "harness-reviewer job (fresh reader of a sellable diff)"

[house.PN-07]
text = "The plan names its user-visible outcome, non-goals, dependencies and delete list (unnecessary features, duplicate mechanisms, replaced wiring), and cites the governing specifications and decisions without reopening them."
why = "Without scope and deletions, plans grow and settled decisions get relitigated."
right = "State the user-visible outcome, non-goals, dependencies and delete list, and cite governing specs and decisions without reopening them."
question = "Are outcome, non-goals and delete list present?"
severity = "S3"
applies = []
cites = []
embodied_by = "harness-planner job (plan from the build order)"

[house.PN-08]
text = "Every normative requirement maps to its journey, acceptance id, evidence owner and task."
why = "Unmapped requirements get dropped without anyone noticing."
right = "Map every normative requirement to its journey, acceptance id, evidence owner and task."
question = "Which requirement of the spec has no task?"
severity = "S3"
applies = []
cites = []
embodied_by = "harness-planner job (plan from the build order)"

[house.PN-09]
text = "The end-to-end flow is mapped before structure is chosen: input, native owner and binding, validation, effect, hand-off, completion and recovery; consumers, trust boundaries, what each owner must not own, lifecycle transitions, timeout, cancel and error paths."
why = "Structure chosen first misses hand-offs and failure paths."
right = "Map the full end-to-end flow, including owners, trust boundaries, timeouts and error paths, before choosing structure."
question = "Is the flow from input to completion and recovery written, with each owner's limits?"
severity = "S3"
applies = []
cites = []
embodied_by = "harness-planner job (plan from the build order)"

[house.PN-10]
text = "The plan reuses before it extends, searches the fix history of the engines and areas it touches, cites the fixes and engine-behaviour notes it relies on, and does not re-decide what a past fix settled."
why = "Repeating old mistakes and duplicating mechanisms wastes work and reintroduces bugs."
right = "Reuse before extending, search past fixes for the areas touched, cite what you rely on, and do not re-decide what a past fix settled."
question = "Which earlier fixes in the touched areas does the plan cite?"
